<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GG OS — Thasbiha Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --blue:#115cff;--blue2:#eef4ff;--ink:#071338;--muted:#687593;--line:#e5ebf5;--soft:#f8faff;
    --green:#08a66a;--orange:#ff8a00;--red:#f43f5e;--purple:#7657ff;--shadow:0 16px 42px rgba(15,31,69,.065);
  }
  *{box-sizing:border-box} html{font-size:14px}
  body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,a,input,textarea,select{font:inherit} button,a{transition:.16s ease} button{cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(17,92,255,.16);outline-offset:2px}
  .app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:16px}
  .brand{display:flex;gap:12px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .logo{width:56px;height:56px;border-radius:18px;background:radial-gradient(circle at 28% 23%,#e8fbff 0,#64ccff 24%,#0b67d1 56%,#061b4d 100%);display:grid;place-items:center;color:white;font-size:25px;box-shadow:0 12px 28px rgba(11,103,209,.16)}
  .brand b{display:block;font-size:18px;line-height:.92;letter-spacing:-.045em;color:#0063b9}.brand span{font-size:10px;color:#60708f;font-weight:700}
  .nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}
  .nav-btn{border:0;background:transparent;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px;text-align:left;color:#111d3e;font-weight:760;font-size:13px;line-height:1.2}
  .nav-btn i{width:18px;color:#385174;text-align:center}.nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#edf3ff,#f8fbff);color:var(--blue)}.nav-btn:hover i,.nav-btn.active i{color:var(--blue)}
  .user-card,.help-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px;box-shadow:var(--shadow)}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#071338,#0987b8);display:grid;place-items:center;color:white;font-size:13px;font-weight:900;border:3px solid #fff;box-shadow:0 8px 20px rgba(15,31,69,.14);overflow:hidden}
  .main{padding:24px 28px 28px;min-width:0}
  .top{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,440px) auto;align-items:center;gap:18px;margin-bottom:22px}
  .top h1{font-size:24px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.04em}.top p{margin:6px 0 0;color:var(--muted);font-weight:650}
  .search{height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 14px;color:#78849d}
  .search kbd{margin-left:auto;background:#f4f7fc;border:1px solid #e8eef8;border-radius:7px;padding:2px 8px;font-size:11px;color:#596681}
  .top-actions{display:flex;align-items:center;gap:12px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;display:grid;place-items:center;color:#162348;position:relative}.dot{position:absolute;top:-7px;right:-6px;background:#ef233c;color:#fff;border-radius:999px;font-size:10px;font-weight:900;padding:2px 6px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h2{font-size:25px;font-weight:900;letter-spacing:-.04em;margin:0}.page-head p{color:var(--muted);font-weight:650;margin-top:5px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;color:#12204a}.btn:hover{background:#f7faff}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.orange{background:var(--orange);border-color:var(--orange);color:white}.btn.red{background:var(--red);border-color:var(--red);color:white}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.pad{padding:17px}.title{font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.link{border:0;background:transparent;color:var(--blue);font-weight:850;padding:0}.link:hover{text-decoration:underline}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.dash-grid{display:grid;grid-template-columns:1.18fr .82fr .82fr;gap:16px}.lower-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
  .stat{display:flex;align-items:center;gap:15px}.stat-icon{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:22px}.stat b{font-size:25px;line-height:1;font-weight:950}.stat small{display:block;color:var(--muted);font-weight:750;margin-top:5px}
  .pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850;white-space:nowrap}.blue{background:#eaf1ff;color:#0757ff}.greenp{background:#eafbf3;color:#078655}.orangep{background:#fff4e5;color:#d66a00}.redp{background:#fff0f2;color:#df2245}.purplep{background:#f2edff;color:#6841e9}.grayp{background:#f4f6fa;color:#60708f}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf2f8}.row:last-child{border-bottom:0}.check,.circle{width:15px;height:15px;border:1.5px solid #9badc9;flex:0 0 auto}.check{border-radius:4px}.circle{border-radius:50%}.done{background:var(--blue);border-color:var(--blue);color:white;display:grid;place-items:center;font-size:9px}
  .progress{height:7px;border-radius:999px;background:#edf2f8;overflow:hidden}.progress span{display:block;height:100%;border-radius:999px}
  .table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}.table th{background:#f7f9fd;color:#6a7590;font-weight:900;text-transform:uppercase;letter-spacing:.04em;text-align:left}.table th,.table td{padding:11px;border-bottom:1px solid #edf2f8}.table tr:last-child td{border-bottom:0}
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tab-chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:850;color:#213051}.tab-chip.active{background:#eef4ff;color:var(--blue);border-color:#d9e6ff}
  .field{width:100%;border:1px solid #dce5f2!important;background:#fbfcff;border-radius:11px;padding:10px 12px;min-height:40px}.field:focus{background:#fff;border-color:#93b0ff!important;box-shadow:0 0 0 4px rgba(17,92,255,.10)}textarea.field{min-height:86px;resize:vertical}
  .quick{position:sticky;bottom:14px;margin-top:18px;padding:13px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 46px rgba(15,31,69,.12);display:flex;align-items:center;justify-content:space-between;gap:14px}.quick-list{display:flex;gap:14px;overflow:auto}.quick-item{min-width:78px;text-align:center;font-size:11px;font-weight:850;color:#111d3e}.quick-item i{display:grid;place-items:center;margin:0 auto 7px;width:38px;height:38px;border-radius:13px;background:#eef4ff;color:var(--blue)}
  .modal{position:fixed;inset:0;background:rgba(7,19,56,.54);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal.open{display:flex}.modal-card{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-head{position:sticky;top:0;background:#fff;padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px}
  #toast{position:fixed;right:22px;top:22px;z-index:120;padding:13px 16px;border-radius:14px;font-weight:850;box-shadow:0 18px 48px rgba(15,31,69,.16);display:none}#toast.ok{display:block;background:#effdf6;color:#067348;border:1px solid #bff4d7}#toast.err{display:block;background:#fff3f4;color:#c01837;border:1px solid #ffd0d8}
  @media(max-width:1220px){.app{grid-template-columns:86px 1fr}.brand div,.nav-btn span,.user-card,.help-card{display:none}.nav-btn{justify-content:center}.side{padding:16px 10px}.top{grid-template-columns:1fr auto}.search{display:none}.grid-5,.grid-6{grid-template-columns:repeat(3,1fr)}.dash-grid,.lower-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){.app{display:block}.side{height:auto;position:static;flex-direction:row;overflow:auto}.brand{display:none}.nav{flex-direction:row}.nav-btn{min-width:62px}.main{padding:16px}.top{display:block}.top-actions{display:none}.page-head{display:block}.grid-2,.grid-3,.grid-4,.grid-5,.grid-6,.dash-grid,.lower-grid{grid-template-columns:1fr}.quick{position:static;display:block}.quick-list{margin-top:12px}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><div><h3 id="modalTitle" class="text-xl font-black"></h3><p id="modalSub" class="muted text-sm"></p></div><button class="icon-btn" onclick="closeModal()"><i class="fas fa-times"></i></button></div><div id="modalBody" class="modal-body"></div></div></div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><i class="fas fa-globe"></i></div><div><b>GLOBAL<br>GUIDANCE</b><span>EDUCATION CONSULTANCY</span></div></div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-tab="today"><i class="fas fa-house"></i><span>Today</span></button>
      <button class="nav-btn" data-tab="work"><i class="fas fa-list-check"></i><span>My Work</span></button>
      <button class="nav-btn" data-tab="attendance"><i class="far fa-clock"></i><span>Attendance</span></button>
      <button class="nav-btn" data-tab="leave"><i class="far fa-calendar-check"></i><span>Leave</span></button>
      <button class="nav-btn" data-tab="operations"><i class="fas fa-briefcase"></i><span>Operations</span></button>
      <button class="nav-btn" data-tab="performance"><i class="fas fa-chart-line"></i><span>Performance</span></button>
      <button class="nav-btn" data-tab="followups"><i class="fas fa-phone"></i><span>Follow Ups & Calls</span></button>
      <button class="nav-btn" data-tab="learning"><i class="fas fa-book-open"></i><span>Learning</span></button>
      <button class="nav-btn" data-tab="documents"><i class="far fa-file-lines"></i><span>Documents</span></button>
      <button class="nav-btn" data-tab="organization"><i class="fas fa-people-group"></i><span>Organization</span></button>
      <button class="nav-btn" data-tab="assets"><i class="fas fa-laptop"></i><span>Assets</span></button>
      <button class="nav-btn" data-tab="ai"><i class="fas fa-wand-magic-sparkles"></i><span>AI Assistant</span></button>
      <button class="nav-btn" data-tab="notifications"><i class="far fa-bell"></i><span>Notifications</span></button>
      <button class="nav-btn" data-tab="communication"><i class="far fa-message"></i><span>Communication</span></button>
      <button class="nav-btn" data-tab="profile"><i class="far fa-user"></i><span>Profile</span></button>
      <button class="nav-btn" data-tab="settings"><i class="fas fa-gear"></i><span>Settings</span></button>
    </nav>
    <div class="mt-auto space-y-4">
      <div class="user-card"><div class="flex items-center gap-3"><div class="avatar">TS</div><div><div class="font-black">Thasbiha S.</div><div class="text-xs muted">Head of Admissions / HR</div><div class="text-xs text-emerald-600 mt-1"><i class="fas fa-circle text-[7px] mr-1"></i>Online</div></div></div></div>
      <button class="help-card w-full text-left" onclick="action('support','Support requested from portal')"><div class="flex items-center justify-between"><div><div class="font-black">Need Help?</div><div class="text-xs muted">Connect with support</div></div><i class="fas fa-chevron-right muted"></i></div></button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1 id="topTitle">Good Morning, Thasbiha 👋</h1><p id="topSub"></p></div>
      <div class="search"><i class="fas fa-search"></i><span>Search students, tasks, reports...</span><kbd>⌘ K</kbd></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="switchTab('notifications')"><i class="far fa-bell"></i><span class="dot">8</span></button>
        <button class="icon-btn" onclick="switchTab('communication')"><i class="far fa-message"></i></button>
        <div class="avatar">TS</div>
      </div>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const API_EMP_ID = 'GG003';
const DISPLAY_EMP_ID = 'GG005';
const USER = { id:3, name:'Thasbiha S.', fullName:'Thasbiha Sulaiman', employeeId:DISPLAY_EMP_ID, role:'Head of Admissions / HR', department:'Admissions & HR', email:'thasbiha@global-guidance.com', phone:'+94 71 345 6789', manager:'Nafees A. (COO)' };
const fmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Colombo',year:'numeric',month:'2-digit',day:'2-digit'});
const TODAY = fmt.format(new Date());
const nowTime = () => new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',minute:'2-digit'});
const dateLong = () => new Date().toLocaleDateString('en-GB',{timeZone:'Asia/Colombo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = (k,f) => { try{return JSON.parse(localStorage.getItem(k)) ?? f}catch{return f} };
const set = (k,v) => localStorage.setItem(k,JSON.stringify(v));

let state = { morningPlan:null, eveningReport:null, kpi:null, escalations:[], interviews:[], uniFollowUps:[], tasks:[], todos:[], attendance:get('tsAttendance',null), calls:get('tsCalls',[]), notes:get('tsNotes',[]), messages:get('tsMessages',[]) };

const baseTasks = [
  {id:'t1',title:'Review new student applications',cat:'Admissions',priority:'High',due:'10:00 AM',status:'In Progress',assignee:'TS'},
  {id:'t2',title:'Follow up with 20 registered students',cat:'Follow Ups',priority:'High',due:'11:30 AM',status:'In Progress',assignee:'TS'},
  {id:'t3',title:'Check pending offers from universities',cat:'Admissions',priority:'Medium',due:'01:00 PM',status:'Pending',assignee:'R'},
  {id:'t4',title:'Verify CAS documents',cat:'CAS & Visa',priority:'Medium',due:'02:30 PM',status:'Pending',assignee:'S'},
  {id:'t5',title:'Admissions team meeting',cat:'Meetings',priority:'Low',due:'03:30 PM',status:'Upcoming',assignee:'N'},
  {id:'t6',title:'Update university follow-up tracker',cat:'Universities',priority:'Low',due:'04:30 PM',status:'Upcoming',assignee:'TS'},
  {id:'t7',title:'Prepare admissions report (Weekly)',cat:'Reports',priority:'Medium',due:'Tomorrow',status:'Upcoming',assignee:'TS'}
];
const baseTodos = ['Call UWE regarding new intake','Buy printer ink','Prepare HR monthly report','Update visa SOP document','Send welcome email to new students'];
const calendar = [
  ['10:00 AM','Admissions Team Meeting','Meeting Room 1','fa-user-group','green'],
  ['12:00 PM','Student Meeting','Shameem (UAE)','fa-video','blue'],
  ['02:30 PM','University Call','UWE / Admissions','fa-phone','purple'],
  ['04:00 PM','Internal Review','Daily Operations','fa-users','orange']
];
const staff = [
  ['Mohamed Nashif','CEO / Founder','CEO','nashif@global-guidance.com'],['Nafees A.','COO','Operations','nafees@global-guidance.com'],['Thasbiha S.','Head of Admissions / HR','Admissions & HR','thasbiha@global-guidance.com'],['Razan T.','Head of BD & Visa','Business Development & Visa','razan@global-guidance.com'],['Umair N.','Sr. Admissions Officer','Admissions','umair@global-guidance.com'],['Binupa K.','Jr. Counselor','Counseling Team','binupa@global-guidance.com'],['Jinushiya J.','Intern','Support & Operations','jinushiya@global-guidance.com'],['Shiran F.','Designer','Marketing','shiran@global-guidance.com'],['Ashadulla','Accountant','Finance','accounts@global-guidance.com']
];
const documents = [
  ['Visa Approval - Anushan P.','Visa','Razan T.','08 Jul 2026','1.2 MB','Approved'],
  ['CAS Letter - Vaidehi N.','Admission','Umair N.','08 Jul 2026','842 KB','Approved'],
  ['Offer Letter - Pinushan R.','Offer Letter','Thasbiha S.','07 Jul 2026','210 KB','Approved'],
  ['Bank Statement - Ilyas M.','Finance','Razan T.','07 Jul 2026','1.8 MB','Pending Review'],
  ['Passport Copy - Akeel S.','ID Proof','Jinushiya J.','07 Jul 2026','620 KB','Approved']
];
const notifications = [
  ['New Application Submitted','A new application has been submitted by Dilshan Perera for MSc International Business','Applications','10:24 AM','fa-graduation-cap','blue'],
  ['Document Awaiting Review','3 student documents are pending your review and approval.','Documents','09:48 AM','fa-file-lines','green'],
  ['Follow Up Reminder','You have 6 pending follow ups due today.','Follow Ups & Calls','09:00 AM','fa-phone','blue'],
  ['Meeting Reminder','Team meeting with COO at 04:30 PM today.','Meetings','08:30 AM','fa-calendar-check','purple'],
  ['Visa Document Update','UK visa checklist updated for Rashika Fernando.','Visas','Yesterday, 05:15 PM','fa-bell','orange'],
  ['Weekly Performance Report Available','Your team weekly performance report is ready to view.','Reports','Yesterday, 04:30 PM','fa-chart-line','orange'],
  ['Task Completed','Jinushiya J. marked task “Contact Aston University” as completed.','Tasks','Yesterday, 03:20 PM','fa-check','green'],
  ['New Team Member Added','Binupa K. has been added to the Counseling Team.','Organization','07 Jul 2026, 02:45 PM','fa-users','purple']
];

function toast(msg,type='ok'){ const t=$('toast'); t.className=type; t.textContent=msg; clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>{t.className=''},2600); }
async function logActivity(type,text,details){ try{ await fetch('/api/v16l/team-activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'thasbiha.s',name:'Thasbiha S.',employeeId:DISPLAY_EMP_ID,type,text,details:details||null})}); }catch(e){} }
function action(type,text,details){ toast(text || 'Done'); logActivity(type,text,details); }
function openModal(title,body,sub=''){ $('modalTitle').textContent=title; $('modalSub').textContent=sub; $('modalBody').innerHTML=body; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }

async function loadAll(){
  state.tasks = get('tsTasks',baseTasks);
  state.todos = get('tsTodos',baseTodos);
  try{
    const [mp,er,k,esc,iv,uf] = await Promise.all([
      fetch('/api/staff-portal/morning-plan/'+API_EMP_ID+'/'+TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/evening-report/'+API_EMP_ID+'/'+TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/kpi/'+API_EMP_ID).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/escalations/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/interviews/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/uni-followups/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]}))
    ]);
    state.morningPlan = mp.plan || null; state.eveningReport = er.report || null; state.kpi = k.kpi || {weekly:{},monthly:{}};
    state.escalations = esc.items || []; state.interviews = iv.items || []; state.uniFollowUps = uf.items || [];
  }catch(e){}
}

function refreshClock(){
  const hour = +new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',hour12:false}).format(new Date());
  $('topTitle').textContent = `${hour<12?'Good Morning':hour<17?'Good Afternoon':'Good Evening'}, Thasbiha 👋`;
  $('topSub').textContent = `${dateLong()} · ${nowTime()}`;
}
refreshClock(); setInterval(refreshClock,30000);

function pageHead(title,sub,actions=''){
  return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="flex gap-2 flex-wrap">${actions}</div></div>`;
}
function statCard(icon,label,value,sub,color='blue'){
  const colors={blue:['#eaf1ff','#0757ff'],green:['#eafbf3','#078655'],orange:['#fff4e5','#d66a00'],red:['#fff0f2','#df2245'],purple:['#f2edff','#6841e9'],cyan:['#e9fbff','#0891b2']};
  const c=colors[color]||colors.blue;
  return `<div class="card pad stat"><div class="stat-icon" style="background:${c[0]};color:${c[1]}"><i class="fas ${icon}"></i></div><div><div class="text-xs font-black">${label}</div><b>${value}</b><small>${sub}</small></div></div>`;
}
function badge(p){ const s=String(p); const cls=s.includes('High')||s.includes('Late')||s.includes('Overdue')?'redp':s.includes('Medium')||s.includes('Pending')?'orangep':s.includes('Low')?'blue':s.includes('Approved')||s.includes('Active')||s.includes('Present')||s.includes('Done')||s.includes('Completed')?'greenp':'grayp'; return `<span class="pill ${cls}">${esc(s)}</span>`; }
function progress(label,val,max,color='var(--blue)'){ const pct=Math.min(100,Math.round((Number(val)/Math.max(Number(max),1))*100)); return `<div class="mb-3"><div class="flex justify-between text-xs font-black"><span>${label}<br><span class="muted">${val} / ${max}</span></span><span>${pct}%</span></div><div class="progress mt-2"><span style="width:${pct}%;background:${color}"></span></div></div>`; }
function table(headers,rows){ return `<table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`; }
function taskRows(limit=7){
  return state.tasks.slice(0,limit).map(t=>`<div class="row">

    <div class="min-w-0 flex-1"><div class="font-black">${esc(t.title)}</div><div class="text-xs muted"><i class="fas fa-building-columns mr-1"></i>${esc(t.cat)}</div></div>

}

function switchTab(name){
  const aliases={dashboard:'today',admissions:'operations',conversion:'performance',interviews:'communication',escalations:'operations','uni-coord':'operations',kpi:'performance',hr:'profile'};
  name = aliases[name] || name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  renderTab(name);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

async function renderTab(name){
  const el=$('content'); el.innerHTML='<div class="card pad muted"><i class="fas fa-spinner fa-spin mr-2"></i>Loading…</div>';

}

let formTasks=[];
function renderMorning(el){
  const mp=state.morningPlan||{}; formTasks=(mp.priorityTasks&&mp.priorityTasks.length?mp.priorityTasks:baseTasks.slice(0,5).map(t=>({title:t.title,priority:t.priority,notes:t.cat})));
  el.innerHTML = `${pageHead('Global Guidance — Daily plan','File this in the morning. KPIs calculate from your evening report based on these targets.')}
    <div class="card pad space-y-5"><div><h3 class="font-black text-blue-600 mb-3">Admissions & Conversion</h3><div class="grid-2 gap-3"><input class="field" id="mpReg" placeholder="Registrations target today" value="${mp.registrationsTarget||4}"><input class="field" id="mpStudents" placeholder="Students to follow up" value="${mp.studentFollowUps||''}"><input class="field" id="mpPending" placeholder="Pending registrations" value="${mp.pendingRegistrations||''}"><input class="field" id="mpPriority" placeholder="Priority conversion cases" value="${mp.priorityCases||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">Top Tasks</h3><div id="morningTasks"></div><button class="link" onclick="addMorningTask()">+ Add task</button></div><div><h3 class="font-black text-blue-600 mb-3">Applications</h3><div class="grid-2 gap-3"><input class="field" id="mpApps" placeholder="Applications to submit" value="${mp.appsToSubmit||0}"><input class="field" id="mpOffers" placeholder="Offer letters to chase" value="${mp.offersToChase||0}"><input class="field" id="mpUnis" placeholder="Universities to follow up" value="${mp.uniFollowUps||''}"><input class="field" id="mpTarget" placeholder="Follow-ups planned target" value="${mp.followupTarget||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">HR & Operations</h3><div class="grid-2 gap-3"><input class="field" id="mpStaff" placeholder="Staff matters" value="${mp.staffMatters||''}"><input class="field" id="mpMeetings" placeholder="Meetings" value="${mp.meetings||''}"><input class="field" id="mpEvents" placeholder="Events" value="${mp.eventsTasks||''}"><input class="field" id="mpEsc" placeholder="Escalations" value="${mp.criticalEscalations||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">Management Support Needed</h3><div class="grid-2 gap-3"><input class="field" id="mpApprovals" placeholder="Pending approvals" value="${mp.pendingApprovals||''}"><input class="field" id="mpDecisions" placeholder="Urgent decisions" value="${mp.supportNeeded||''}"></div></div><button class="btn primary w-full" onclick="submitMorning()">Submit Global Guidance plan</button></div>`;
  renderMorningTasks();
}
function renderMorningTasks(){ $('morningTasks').innerHTML=formTasks.map((t,i)=>`<div class="flex gap-2 mb-2"><select class="field !w-28" onchange="formTasks[${i}].priority=this.value"><option ${t.priority==='High'?'selected':''}>High</option><option ${t.priority==='Medium'?'selected':''}>Medium</option><option ${t.priority==='Low'?'selected':''}>Low</option></select><input class="field" value="${esc(t.title)}" oninput="formTasks[${i}].title=this.value"><input class="field" value="${esc(t.notes||'')}" oninput="formTasks[${i}].notes=this.value"><button class="btn red" onclick="formTasks.splice(${i},1);renderMorningTasks()">×</button></div>`).join(''); }
function addMorningTask(){ formTasks.push({title:'',priority:'Medium',notes:''}); renderMorningTasks(); }
async function submitMorning(){ const plan={date:TODAY,priorityTasks:formTasks.filter(t=>t.title),registrationsTarget:$('mpReg').value,studentFollowUps:$('mpStudents').value,pendingRegistrations:$('mpPending').value,priorityCases:$('mpPriority').value,appsToSubmit:$('mpApps').value,offersToChase:$('mpOffers').value,uniFollowUps:$('mpUnis').value,followupTarget:$('mpTarget').value,staffMatters:$('mpStaff').value,meetings:$('mpMeetings').value,eventsTasks:$('mpEvents').value,criticalEscalations:$('mpEsc').value,pendingApprovals:$('mpApprovals').value,supportNeeded:$('mpDecisions').value}; try{ const r=await fetch('/api/staff-portal/morning-plan/'+API_EMP_ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(plan)}); const j=await r.json(); if(!j.success) throw new Error(j.error); }catch(e){ set('tsMorningPlan',plan); } state.morningPlan=plan; action('morning-plan','Morning plan submitted',plan); switchTab('today'); }

function renderEvening(el){
  const er=state.eveningReport||{};

    <div class="card pad space-y-5"><div class="grid-2 gap-4"><label>Completed Tasks *<textarea class="field" id="erDone">${er.tasksCompleted||''}</textarea></label><label>Pending Tasks<textarea class="field" id="erPending">${er.pendingTomorrow||''}</textarea></label><label>Reason for Delay<textarea class="field" id="erReason">${er.operationalChallenges||''}</textarea></label><label>Achievements<textarea class="field" id="erAch">${er.achievements||''}</textarea></label></div><h3 class="font-black">Today's Numbers</h3><div class="grid-4 gap-3">${['Registrations','Applications','Offers','CAS','COE','Visa updates','Calls','Meetings','Escalations resolved'].map((x,i)=>`<label>${x}<input type="number" min="0" class="field" id="erN${i}" value="${[12,18,7,4,2,5,8,3,2][i]}"></label>`).join('')}</div><div class="grid-2 gap-4"><label>Tomorrow Plan *<textarea class="field" id="erTomorrow">${er.tomorrowPlan||''}</textarea></label><label>Support Needed<textarea class="field" id="erSupport">${er.supportNeeded||''}</textarea></label></div><button class="btn primary w-full" onclick="submitEvening()">Submit report & check out</button></div>`;

async function submitEvening(){ const report={date:TODAY,tasksCompleted:$('erDone').value,pendingTomorrow:$('erPending').value,operationalChallenges:$('erReason').value,achievements:$('erAch').value,conversionUpdates:{registrationsCompleted:+$('erN0').value||0,applicationsSubmitted:+$('erN1').value||0,offersReceived:+$('erN2').value||0,cas:+$('erN3').value||0,coe:+$('erN4').value||0,visaUpdates:+$('erN5').value||0,calls:+$('erN6').value||0,meetings:+$('erN7').value||0,escalationsResolved:+$('erN8').value||0},tomorrowPlan:$('erTomorrow').value,supportNeeded:$('erSupport').value}; try{ const r=await fetch('/api/staff-portal/evening-report/'+API_EMP_ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)}); const j=await r.json(); if(!j.success) throw new Error(j.error); }catch(e){ set('tsEveningReport',report); } state.eveningReport=report; await checkOut(true); action('daily-report','Evening report submitted and checked out',report); switchTab('today'); }

function addTaskModal(){ openModal('Add Task','<div class="space-y-3"><input id="newTaskTitle" class="field" placeholder="Task title"><select id="newTaskPriority" class="field"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="newTaskDue" class="field" placeholder="Due time/date" value="Today"><button class="btn primary w-full" onclick="saveTask()">Save Task</button></div>','Create a role task for today'); }
function saveTask(){ const title=$('newTaskTitle').value.trim(); if(!title) return toast('Task title is required','err'); state.tasks.push({id:'t'+Date.now(),title,cat:'Admissions',priority:$('newTaskPriority').value,due:$('newTaskDue').value,status:'Pending',assignee:'TS'}); set('tsTasks',state.tasks); closeModal(); action('task','Task created: '+title); switchTab('work'); }
function editTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; const n=prompt('Update task title:',t.title); if(!n)return; t.title=n; set('tsTasks',state.tasks); action('task','Task updated: '+n); switchTab('work'); }
function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; t.status=t.status==='Completed'?'Pending':'Completed'; set('tsTasks',state.tasks); action('task','Task '+(t.status==='Completed'?'completed':'reopened')+': '+t.title); switchTab('work'); }
function groupTasks(){ toast('Tasks grouped by priority'); }
function addTodo(){ const t=prompt('Add private to-do:'); if(!t)return; state.todos.push(t); set('tsTodos',state.todos); action('todo','Personal to-do added: '+t); switchTab('work'); }
function removeTodo(i){ const t=state.todos.splice(i,1)[0]; set('tsTodos',state.todos); action('todo','Personal to-do completed: '+t); switchTab('work'); }
async function checkIn(){ const mode=prompt('Work mode: Office, Remote or Field?','Office')||'Office'; const a={checkedIn:true,time:nowTime(),date:TODAY,mode,location:mode==='Office'?'Office - Colombo HQ':mode,ip:'Logged by browser'}; state.attendance=a; set('tsAttendance',a); try{await fetch('/api/v16l/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'thasbiha.s',employeeId:DISPLAY_EMP_ID,type:'check-in',mode,location:a.location})})}catch(e){} action('attendance','Checked in: '+mode,a); switchTab('morning'); }
async function checkOut(fromReport=false){ if(!fromReport && !state.eveningReport){ toast('Please submit the daily report before check out','err'); return switchTab('evening'); } const a=state.attendance||{}; a.checkedIn=false; a.checkedOut=nowTime(); a.hours='8h 30m'; state.attendance=a; set('tsAttendance',a); try{await fetch('/api/v16l/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'thasbiha.s',employeeId:DISPLAY_EMP_ID,type:'check-out'})})}catch(e){} if(!fromReport) action('attendance','Checked out',a); }
