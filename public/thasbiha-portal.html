<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GG OS — HR Manager Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root{
    --blue:#115cff;--blue2:#eef4ff;--ink:#071338;--muted:#687593;--line:#e5ebf5;--soft:#f8faff;
    --green:#08a66a;--orange:#ff8a00;--red:#f43f5e;--purple:#7657ff;--shadow:0 16px 42px rgba(15,31,69,.065);
  }
  *{box-sizing:border-box} html{font-size:13.5px}
  body{margin:0;background:var(--soft);color:var(--ink);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.45}
  button,a,input,textarea,select{font:inherit} button,a{transition:.16s ease} button{cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(17,92,255,.16);outline-offset:2px}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
  .brand{display:flex;align-items:center;justify-content:center;padding:0 4px 15px;border-bottom:1px solid var(--line)}
  .brand-logo-img{width:152px;max-width:100%;height:auto;display:block;object-fit:contain}
  .logo,.brand b,.brand span{display:none}
  .nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}
  .nav-btn{border:0;background:transparent;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:11px;text-align:left;color:#111d3e;font-weight:730;font-size:12.5px;line-height:1.22}
  .nav-btn i{width:18px;color:#385174;text-align:center}.nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#edf3ff,#f8fbff);color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}.nav-btn:hover i,.nav-btn.active i{color:var(--blue)}
  .user-card,.help-card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px;box-shadow:var(--shadow)}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#071338,#0987b8);display:grid;place-items:center;color:white;font-size:13px;font-weight:900;border:3px solid #fff;box-shadow:0 8px 20px rgba(15,31,69,.14);overflow:hidden}
  .main{padding:22px 24px 26px;min-width:0}
  .top{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,420px) auto;align-items:center;gap:16px;margin-bottom:20px}
  .top h1{font-size:21px;line-height:1.12;margin:0;font-weight:900;letter-spacing:-.035em}.top p{margin:5px 0 0;color:var(--muted);font-weight:640}
  .search{height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;padding:0 13px;color:#78849d}
  .search kbd{margin-left:auto;background:#f4f7fc;border:1px solid #e8eef8;border-radius:7px;padding:2px 8px;font-size:11px;color:#596681}
  .top-actions{display:flex;align-items:center;gap:10px;position:relative}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;color:#162348;position:relative}.icon-btn:hover{background:#f7faff;border-color:#d7e4f7}.dot{position:absolute;top:-7px;right:-6px;background:#ef233c;color:#fff;border-radius:999px;font-size:10px;font-weight:900;padding:2px 6px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:17px}.page-head h2{font-size:22px;font-weight:900;letter-spacing:-.035em;margin:0}.page-head p{color:var(--muted);font-weight:640;margin-top:4px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:780;color:#12204a}.btn:hover{background:#f7faff}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.orange{background:var(--orange);border-color:var(--orange);color:white}.btn.red{background:var(--red);border-color:var(--red);color:white}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.pad{padding:15px}.title{font-weight:880;letter-spacing:-.015em;display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.link{border:0;background:transparent;color:var(--blue);font-weight:820;padding:0}.link:hover{text-decoration:underline}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.dash-grid{display:grid;grid-template-columns:1.18fr .82fr .82fr;gap:14px}.lower-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
  .stat{display:flex;align-items:center;gap:13px}.stat-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:18px}.stat b{font-size:22px;line-height:1;font-weight:920}.stat small{display:block;color:var(--muted);font-weight:720;margin-top:4px}
  .pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850;white-space:nowrap}.blue{background:#eaf1ff;color:#0757ff}.greenp{background:#eafbf3;color:#078655}.orangep{background:#fff4e5;color:#d66a00}.redp{background:#fff0f2;color:#df2245}.purplep{background:#f2edff;color:#6841e9}.grayp{background:#f4f6fa;color:#60708f}
  .row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #edf2f8}.row:last-child{border-bottom:0}.check,.circle{width:15px;height:15px;border:1.5px solid #9badc9;flex:0 0 auto}.check{border-radius:4px}.circle{border-radius:50%}.done{background:var(--blue);border-color:var(--blue);color:white;display:grid;place-items:center;font-size:9px}
  .progress{height:7px;border-radius:999px;background:#edf2f8;overflow:hidden}.progress span{display:block;height:100%;border-radius:999px}
  .table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}.table th{background:#f7f9fd;color:#6a7590;font-weight:880;text-transform:uppercase;letter-spacing:.035em;text-align:left}.table th,.table td{padding:10px;border-bottom:1px solid #edf2f8}.table tr:last-child td{border-bottom:0}
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tab-chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:850;color:#213051;white-space:nowrap}.tab-chip.active{background:#eef4ff;color:var(--blue);border-color:#d9e6ff}
  .field{width:100%;border:1px solid #dce5f2!important;background:#fbfcff;border-radius:11px;padding:10px 12px;min-height:40px}.field:focus{background:#fff;border-color:#93b0ff!important;box-shadow:0 0 0 4px rgba(17,92,255,.10)}textarea.field{min-height:86px;resize:vertical}
  .empty-state{border:1px dashed #dbe6f5;border-radius:13px;background:#fbfdff;padding:18px;text-align:center;color:var(--muted);font-weight:700}.hint{background:#f6f9ff;border:1px solid #dfeaff;border-radius:12px;padding:10px 12px;color:#4d5f82;font-size:12px;font-weight:720}.error-text{color:var(--red);font-size:12px;font-weight:800;margin-top:6px;display:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .quick{position:sticky;bottom:14px;margin-top:17px;padding:12px 15px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 46px rgba(15,31,69,.12);display:flex;align-items:center;justify-content:space-between;gap:13px}.quick-list{display:flex;gap:12px;overflow:auto}.quick-item{min-width:72px;text-align:center;font-size:10.5px;font-weight:820;color:#111d3e}.quick-item i{display:grid;place-items:center;margin:0 auto 6px;width:34px;height:34px;border-radius:12px;background:#eef4ff;color:var(--blue)}
  .modal{position:fixed;inset:0;background:rgba(7,19,56,.54);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal.open{display:flex}.modal-card{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-head{position:sticky;top:0;background:#fff;padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px}
  .popover{position:absolute;right:0;top:50px;width:min(370px,92vw);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(15,31,69,.18);z-index:80;display:none;overflow:hidden}.popover.open{display:block}.popover-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.popover-body{max-height:430px;overflow:auto}.task-group-title{font-weight:900;margin:16px 0 8px;color:#52617f;text-transform:uppercase;font-size:11px;letter-spacing:.06em}.section-empty{border:1px dashed #dbe6f5;border-radius:13px;background:#fbfdff;padding:22px;text-align:center;color:var(--muted);font-weight:750}
  #toast{position:fixed;right:22px;top:22px;z-index:120;padding:13px 16px;border-radius:14px;font-weight:850;box-shadow:0 18px 48px rgba(15,31,69,.16);display:none}#toast.ok{display:block;background:#effdf6;color:#067348;border:1px solid #bff4d7}#toast.err{display:block;background:#fff3f4;color:#c01837;border:1px solid #ffd0d8}
  @media(max-width:1220px){.app{grid-template-columns:86px 1fr}.brand-logo-img{width:54px}.nav-btn span,.user-card,.help-card{display:none}.nav-btn{justify-content:center}.side{padding:16px 10px}.top{grid-template-columns:1fr auto}.search{display:none}.grid-5,.grid-6{grid-template-columns:repeat(3,1fr)}.dash-grid,.lower-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){.app{display:block}.side{height:auto;position:static;flex-direction:row;overflow:auto}.brand{display:none}.nav{flex-direction:row}.nav-btn{min-width:62px}.main{padding:16px}.top{display:block}.top-actions{display:none}.page-head{display:block}.grid-2,.grid-3,.grid-4,.grid-5,.grid-6,.dash-grid,.lower-grid{grid-template-columns:1fr}.quick{position:static;display:block}.quick-list{margin-top:12px}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><div><h3 id="modalTitle" class="text-xl font-black"></h3><p id="modalSub" class="muted text-sm"></p></div><button class="icon-btn" onclick="closeModal()" title="Close dialog" aria-label="Close dialog"><i class="fas fa-times" aria-hidden="true"></i></button></div><div id="modalBody" class="modal-body"></div></div></div>

<div class="app">
  <aside class="side">
    <div class="brand"><img class="brand-logo-img" src="assets/gg-full-logo.png" alt="Global Guidance Education Consultancy"></div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-tab="today" title="Open Today dashboard" aria-label="Open Today dashboard"><i class="fas fa-house"></i><span>Today</span></button>
      <button class="nav-btn" data-tab="work" title="Open My Work" aria-label="Open My Work"><i class="fas fa-list-check"></i><span>My Work</span></button>
      <button class="nav-btn" data-tab="attendance" title="Open Attendance" aria-label="Open Attendance"><i class="far fa-clock"></i><span>Attendance</span></button>
      <button class="nav-btn" data-tab="leave" title="Open Leave" aria-label="Open Leave"><i class="far fa-calendar-check"></i><span>Leave</span></button>
      <button class="nav-btn" data-tab="operations" title="Open Operations" aria-label="Open Operations"><i class="fas fa-briefcase"></i><span>Operations</span></button>
      <button class="nav-btn" data-tab="performance" title="Open Performance" aria-label="Open Performance"><i class="fas fa-chart-line"></i><span>Performance</span></button>
      <button class="nav-btn" data-tab="followups" title="Open Follow Ups and Calls" aria-label="Open Follow Ups and Calls"><i class="fas fa-phone"></i><span>Follow Ups & Calls</span></button>
      <button class="nav-btn" data-tab="learning" title="Open Learning" aria-label="Open Learning"><i class="fas fa-book-open"></i><span>Learning</span></button>
      <button class="nav-btn" data-tab="documents" title="Open Documents" aria-label="Open Documents"><i class="far fa-file-lines"></i><span>Documents</span></button>
      <button class="nav-btn" data-tab="organization" title="Open Organization" aria-label="Open Organization"><i class="fas fa-people-group"></i><span>Organization</span></button>
      <button class="nav-btn" data-tab="assets" title="Open Assets" aria-label="Open Assets"><i class="fas fa-laptop"></i><span>Assets</span></button>
      <button class="nav-btn" data-tab="ai" title="Open AI Assistant" aria-label="Open AI Assistant"><i class="fas fa-wand-magic-sparkles"></i><span>AI Assistant</span></button>
      <button class="nav-btn" data-tab="notifications" title="Open Notifications" aria-label="Open Notifications"><i class="far fa-bell"></i><span>Notifications</span></button>
      <button class="nav-btn" data-tab="communication" title="Open Communication" aria-label="Open Communication"><i class="far fa-message"></i><span>Communication</span></button>
      <button class="nav-btn" data-tab="profile" title="Open Profile" aria-label="Open Profile"><i class="far fa-user"></i><span>Profile</span></button>
      <button class="nav-btn" data-tab="settings" title="Open Settings" aria-label="Open Settings"><i class="fas fa-gear"></i><span>Settings</span></button>
    </nav>
    <div class="mt-auto space-y-4">
      <div class="user-card"><div class="flex items-center gap-3"><div class="avatar">HR</div><div><div class="font-black">HR Manager Portal</div><div class="text-xs muted">Thasbiha S. · HR Manager</div><div class="text-xs text-emerald-600 mt-1"><i class="fas fa-circle text-[7px] mr-1"></i>Online</div></div></div></div>
      <button class="help-card w-full text-left" onclick="action('support','Support requested from portal')"><div class="flex items-center justify-between"><div><div class="font-black">Need Help?</div><div class="text-xs muted">Connect with support</div></div><i class="fas fa-chevron-right muted"></i></div></button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1 id="topTitle">HR Manager Portal</h1><p id="topSub"></p></div>
      <button class="search text-left" onclick="openSearch()" title="Search students, tasks, documents and reports" aria-label="Search students, tasks, documents and reports"><i class="fas fa-search" aria-hidden="true"></i><span>Search students, tasks, reports...</span><kbd>⌘ K</kbd></button>
      <div class="top-actions">
        <button class="icon-btn" onclick="openNotificationsMenu()" title="Show notifications" aria-label="Show notifications"><i class="far fa-bell" aria-hidden="true"></i><span class="dot" aria-label="8 unread notifications">8</span></button>
        <button class="icon-btn" onclick="openMessagesMenu()" title="Show messages" aria-label="Show messages"><i class="far fa-message" aria-hidden="true"></i></button>
        <button class="avatar" onclick="openAccountMenu()" title="Open account menu" aria-label="Open account menu">TS</button>
        <div id="topPopover" class="popover" role="dialog" aria-label="Quick panel"></div>
      </div>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const PORTAL_USERNAME = 'hr.manager';
const API_EMP_ID = 'GG005';
const DISPLAY_EMP_ID = 'GG005';
const USER = { id:5, username:PORTAL_USERNAME, name:'HR Manager Portal', fullName:'Thasbiha Sulaiman', employeeId:DISPLAY_EMP_ID, role:'HR Manager', department:'HR', email:'thasbiha@global-guidance.com', phone:'+94 71 345 6789', manager:'Nafees A. (COO)' };
const fmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Colombo',year:'numeric',month:'2-digit',day:'2-digit'});
const TODAY = fmt.format(new Date());
const nowTime = () => new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',minute:'2-digit'});
const dateLong = () => new Date().toLocaleDateString('en-GB',{timeZone:'Asia/Colombo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = (k,f) => { try{return JSON.parse(localStorage.getItem(k)) ?? f}catch{return f} };
const set = (k,v) => localStorage.setItem(k,JSON.stringify(v));
const DATA_VERSION = '2026-08-04-hr-manager-v1';
if(localStorage.getItem('tsDataVersion') !== DATA_VERSION){
  ['tsTasks','tsTodos','tsCalls','tsNotes','tsMessages','tsMorningPlan','tsEveningReport','tsAttendance','tsAIHistory','tsNotificationsRead','tsTaskGroup','tsWorkView'].forEach(k=>localStorage.removeItem(k));
  localStorage.setItem('tsDataVersion', DATA_VERSION);
}

let state = { morningPlan:null, eveningReport:null, kpi:null, escalations:[], interviews:[], uniFollowUps:[], tasks:[], todos:[], attendance:get('tsAttendance',null), calls:get('tsCalls',[]), notes:get('tsNotes',[]), messages:get('tsMessages',[]), workView:get('tsWorkView','overview'), taskGroup:get('tsTaskGroup','none') };

const baseTasks = [
  {id:'t1',title:'Review new student applications',cat:'Admissions',priority:'High',due:'10:00 AM',status:'In Progress',assignee:'TS'},
  {id:'t2',title:'Follow up with 20 registered students',cat:'Follow Ups',priority:'High',due:'11:30 AM',status:'In Progress',assignee:'TS'},
  {id:'t3',title:'Check pending offers from universities',cat:'Admissions',priority:'Medium',due:'01:00 PM',status:'Pending',assignee:'R'},
  {id:'t4',title:'Verify CAS documents',cat:'CAS & Visa',priority:'Medium',due:'02:30 PM',status:'Pending',assignee:'S'},
  {id:'t5',title:'Admissions team meeting',cat:'Meetings',priority:'Low',due:'10:00 AM',status:'Upcoming',assignee:'N'},
  {id:'t6',title:'Update university follow-up tracker',cat:'Universities',priority:'Low',due:'04:30 PM',status:'Upcoming',assignee:'TS'},
  {id:'t7',title:'Prepare admissions report (Weekly)',cat:'Reports',priority:'Medium',due:'Tomorrow',status:'Upcoming',assignee:'TS'}
];
const baseTodos = [];
const calendar = [];
const announcements = [
  {date:'2026-08-03',label:'03 AUG',title:'August intake priority',body:'Check UK September intake follow-ups before 3:00 PM.',expires:'2026-08-04'},
  {date:'2026-08-05',label:'05 AUG',title:'Team review',body:'Admissions and visa pipeline review with COO at 10:00 AM.',expires:'2026-08-06'},
  {date:'2026-08-08',label:'08 AUG',title:'SOP refresh',body:'Updated visa document checklist will be published this week.',expires:'2026-08-10'}
];
const staff = [
  ['Mohamed Nashif','CEO / Founder','CEO','nashif@global-guidance.com'],['Nafees A.','COO','Operations','nafees@global-guidance.com'],['Thasbiha S.','HR Manager','HR','thasbiha@global-guidance.com'],['Razan T.','Head of BD & Visa','Business Development & Visa','razan@global-guidance.com'],['Umair N.','Sr. Admissions Officer','Admissions','umair@global-guidance.com'],['Binupa K.','Jr. Counselor','Counseling Team','binupa@global-guidance.com'],['Jinushiya J.','Intern','Support & Operations','jinushiya@global-guidance.com'],['Shiran F.','Designer','Marketing','shiran@global-guidance.com'],['Ashadulla','Accountant','Finance','accounts@global-guidance.com']
];
const documents = [];
const notifications = [
  ['Workspace cleaned','Old sample data was cleared from the HR Manager portal.','System','Today','fa-broom','green'],
  ['Live activity ready','New attendance, plans, reports, tasks and calls will be logged from today.','Activity','Today','fa-bolt','blue'],
  ['Documents ready','Upload or connect Google Drive to start adding live documents.','Documents','Today','fa-file-lines','purple']
];

function toast(msg,type='ok'){ const t=$('toast'); t.className=type; t.textContent=msg; clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>{t.className=''},2600); }
async function logActivity(type,text,details){ try{ await fetch('/api/v16l/team-activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:PORTAL_USERNAME,name:USER.fullName,employeeId:DISPLAY_EMP_ID,type,text,details:details||null})}); }catch(e){} }
function action(type,text,details){ toast(text || 'Done'); logActivity(type,text,details); }
function openModal(title,body,sub=''){ $('modalTitle').textContent=title; $('modalSub').textContent=sub; $('modalBody').innerHTML=body; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }

async function loadAll(){
  state.tasks = get('tsTasks',baseTasks);
  state.todos = get('tsTodos',baseTodos);
  try{
    const [mp,er,k,esc,iv,uf] = await Promise.all([
      fetch('/api/staff-portal/morning-plan/'+API_EMP_ID+'/'+TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/evening-report/'+API_EMP_ID+'/'+TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/kpi/'+API_EMP_ID).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/escalations/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/interviews/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/uni-followups/'+API_EMP_ID).then(r=>r.json()).catch(()=>({items:[]}))
    ]);
    state.morningPlan = mp.plan || get('tsMorningPlan', null); state.eveningReport = er.report || get('tsEveningReport', null); state.kpi = k.kpi || {weekly:{},monthly:{}};
    state.escalations = esc.items || []; state.interviews = iv.items || []; state.uniFollowUps = uf.items || [];
  }catch(e){}
}

function refreshClock(){
  const hour = +new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',hour12:false}).format(new Date());
  $('topTitle').textContent = `${hour<12?'Good Morning':hour<17?'Good Afternoon':'Good Evening'}, HR Manager 👋`;
  $('topSub').textContent = `${dateLong()} · ${nowTime()}`;
}
refreshClock(); setInterval(refreshClock,30000);

function pageHead(title,sub,actions=''){
  return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p><div class="mt-2">${badge('Role access: '+USER.role)}</div></div><div class="flex gap-2 flex-wrap">${actions}</div></div>`;
}
function statCard(icon,label,value,sub,color='blue'){
  const colors={blue:['#eaf1ff','#0757ff'],green:['#eafbf3','#078655'],orange:['#fff4e5','#d66a00'],red:['#fff0f2','#df2245'],purple:['#f2edff','#6841e9'],cyan:['#e9fbff','#0891b2']};
  const c=colors[color]||colors.blue;
  return `<div class="card pad stat"><div class="stat-icon" style="background:${c[0]};color:${c[1]}"><i class="fas ${icon}"></i></div><div><div class="text-xs font-black">${label}</div><b>${value}</b><small>${sub}</small></div></div>`;
}
function badge(p){ const s=String(p); const cls=s.includes('High')||s.includes('Late')||s.includes('Overdue')?'redp':s.includes('Medium')||s.includes('Pending')?'orangep':s.includes('Low')?'blue':s.includes('Approved')||s.includes('Active')||s.includes('Present')||s.includes('Done')||s.includes('Completed')?'greenp':'grayp'; return `<span class="pill ${cls}">${esc(s)}</span>`; }
function progress(label,val,max,color='var(--blue)'){ const pct=Math.min(100,Math.round((Number(val)/Math.max(Number(max),1))*100)); const desc=pct>=80?'On track':pct>=50?'Needs steady follow-up':'At risk'; return `<div class="mb-3"><div class="flex justify-between text-xs font-black"><span>${label}<br><span class="muted">${val} of ${max} completed · ${desc}</span></span><span>${pct}%</span></div><div class="progress mt-2" aria-label="${esc(label)} ${pct}% ${desc}"><span style="width:${pct}%;background:${color}"></span></div></div>`; }
function table(headers,rows){ return `<table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`; }
function taskRows(limit=7, items=state.tasks){
  const rows = items.slice(0,limit);
  if(!rows.length) return '<div class="section-empty">No tasks found for this view. You are clear here.</div>';
  return rows.map(t=>`<div class="row">
    <button class="check ${t.status==='Completed'?'done':''}" onclick="toggleTask('${t.id}')" title="${t.status==='Completed'?'Reopen':'Complete'} task: ${esc(t.title)}" aria-label="${t.status==='Completed'?'Reopen':'Complete'} task: ${esc(t.title)}">${t.status==='Completed'?'<i class="fas fa-check" aria-hidden="true"></i>':''}</button>
    <div class="min-w-0 flex-1"><div class="font-black">${esc(t.title)}</div><div class="text-xs muted"><i class="fas fa-building-columns mr-1"></i>${esc(t.cat)}</div></div>
    ${badge('Priority: '+t.priority)}${badge('Status: '+t.status)}<span class="text-xs muted w-[74px] text-right">${esc(t.due)}</span><button class="icon-btn !w-8 !h-8" onclick="editTask('${t.id}')" title="Edit task: ${esc(t.title)}" aria-label="Edit task: ${esc(t.title)}"><i class="fas fa-ellipsis-vertical" aria-hidden="true"></i></button>
  </div>`).join('');
}
function getWorkTasks(view=state.workView){
  if(view==='completed') return state.tasks.filter(t=>t.status==='Completed');
  if(view==='upcoming') return state.tasks.filter(t=>t.status==='Upcoming' || /tomorrow|next|upcoming/i.test(String(t.due)));
  if(view==='overdue') return state.tasks.filter(t=>/overdue/i.test(String(t.due)) || t.status==='Overdue');
  return state.tasks;
}
function groupedTaskRows(items){
  if(state.taskGroup==='none') return taskRows(50,items);
  const key = state.taskGroup==='status' ? 'status' : 'priority';
  const order = key==='priority' ? ['High','Medium','Low'] : ['In Progress','Pending','Upcoming','Completed','Overdue'];
  const sections = order.map(label=>{
    const group = items.filter(t=>t[key]===label);
    return group.length ? `<div class="task-group-title">${label} · ${group.length}</div>${taskRows(50,group)}` : '';
  }).join('');
  return sections || '<div class="section-empty">No tasks found in this grouping.</div>';
}
function calendarRows(){ const colors={green:'#08a66a',blue:'#115cff',purple:'#7657ff',orange:'#ff8a00'}; if(!calendar.length) return '<div class="section-empty">No live calendar events for today. Add a meeting or connect Google Calendar from Settings.</div>'; return calendar.map(([time,title,sub,icon,color])=>`<button class="row w-full text-left" onclick="openCalendarEvent('${esc(title)}','${esc(time)}','${esc(sub)}')" title="Open calendar event: ${esc(title)}" aria-label="Open calendar event: ${esc(title)} at ${esc(time)}"><div class="w-[72px] text-xs font-black">${time}</div><div class="w-1 h-11 rounded" style="background:${colors[color]||colors.blue}"></div><div class="flex-1"><div class="font-black">${title}</div><div class="text-xs muted">${sub}</div></div><i class="fas ${icon}" style="color:${colors[color]||colors.blue}" aria-hidden="true"></i></button>`).join(''); }
function activeAnnouncements(){ return announcements.filter(a=>!a.expires || a.expires>=TODAY); }

function switchTab(name){
  const aliases={dashboard:'today',admissions:'operations',conversion:'performance',interviews:'communication',escalations:'operations','uni-coord':'operations',kpi:'performance',hr:'profile'};
  name = aliases[name] || name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  renderTab(name);
}

async function renderTab(name){

}

let formTasks=[];
function renderMorning(el){
  const mp=state.morningPlan||{}; formTasks=(mp.priorityTasks&&mp.priorityTasks.length?mp.priorityTasks:baseTasks.slice(0,5).map(t=>({title:t.title,priority:t.priority,notes:t.cat})));
  el.innerHTML = `${pageHead('Global Guidance — Daily plan','File this in the morning. KPIs calculate from your evening report based on these targets.')}
    <div class="card pad space-y-5"><div><h3 class="font-black text-blue-600 mb-3">Admissions & Conversion</h3><div class="grid-2 gap-3"><input class="field" id="mpReg" placeholder="Registrations target today" value="${mp.registrationsTarget||4}"><input class="field" id="mpStudents" placeholder="Students to follow up" value="${mp.studentFollowUps||''}"><input class="field" id="mpPending" placeholder="Pending registrations" value="${mp.pendingRegistrations||''}"><input class="field" id="mpPriority" placeholder="Priority conversion cases" value="${mp.priorityCases||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">Top Tasks</h3><div id="morningTasks"></div><button class="link" onclick="addMorningTask()">+ Add task</button></div><div><h3 class="font-black text-blue-600 mb-3">Applications</h3><div class="grid-2 gap-3"><input class="field" id="mpApps" placeholder="Applications to submit" value="${mp.appsToSubmit||0}"><input class="field" id="mpOffers" placeholder="Offer letters to chase" value="${mp.offersToChase||0}"><input class="field" id="mpUnis" placeholder="Universities to follow up" value="${mp.uniFollowUps||''}"><input class="field" id="mpTarget" placeholder="Follow-ups planned target" value="${mp.followupTarget||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">HR & Operations</h3><div class="grid-2 gap-3"><input class="field" id="mpStaff" placeholder="Staff matters" value="${mp.staffMatters||''}"><input class="field" id="mpMeetings" placeholder="Meetings" value="${mp.meetings||''}"><input class="field" id="mpEvents" placeholder="Events" value="${mp.eventsTasks||''}"><input class="field" id="mpEsc" placeholder="Escalations" value="${mp.criticalEscalations||''}"></div></div><div><h3 class="font-black text-blue-600 mb-3">Management Support Needed</h3><div class="grid-2 gap-3"><input class="field" id="mpApprovals" placeholder="Pending approvals" value="${mp.pendingApprovals||''}"><input class="field" id="mpDecisions" placeholder="Urgent decisions" value="${mp.supportNeeded||''}"></div></div><button class="btn primary w-full" onclick="submitMorning()">Submit Global Guidance plan</button></div>`;
  renderMorningTasks();
}
function renderMorningTasks(){ $('morningTasks').innerHTML=formTasks.map((t,i)=>`<div class="flex gap-2 mb-2"><select class="field !w-28" onchange="formTasks[${i}].priority=this.value"><option ${t.priority==='High'?'selected':''}>High</option><option ${t.priority==='Medium'?'selected':''}>Medium</option><option ${t.priority==='Low'?'selected':''}>Low</option></select><input class="field" value="${esc(t.title)}" oninput="formTasks[${i}].title=this.value"><input class="field" value="${esc(t.notes||'')}" oninput="formTasks[${i}].notes=this.value"><button class="btn red" onclick="formTasks.splice(${i},1);renderMorningTasks()">×</button></div>`).join(''); }
function addMorningTask(){ formTasks.push({title:'',priority:'Medium',notes:''}); renderMorningTasks(); }
async function submitMorning(){ const plan={date:TODAY,priorityTasks:formTasks.filter(t=>t.title),registrationsTarget:$('mpReg').value,studentFollowUps:$('mpStudents').value,pendingRegistrations:$('mpPending').value,priorityCases:$('mpPriority').value,appsToSubmit:$('mpApps').value,offersToChase:$('mpOffers').value,uniFollowUps:$('mpUnis').value,followupTarget:$('mpTarget').value,staffMatters:$('mpStaff').value,meetings:$('mpMeetings').value,eventsTasks:$('mpEvents').value,criticalEscalations:$('mpEsc').value,pendingApprovals:$('mpApprovals').value,supportNeeded:$('mpDecisions').value}; try{ const r=await fetch('/api/staff-portal/morning-plan/'+API_EMP_ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(plan)}); const j=await r.json(); if(!j.success) throw new Error(j.error); }catch(e){ set('tsMorningPlan',plan); } state.morningPlan=plan; action('morning-plan','Morning plan submitted',plan); switchTab('today'); }

function renderEvening(el){
  const er=state.eveningReport||{};
  el.innerHTML = `${pageHead('Global Guidance — Evening report','File before logging out. KPI scorecard auto-fills from these numbers.')}
    <div class="card pad space-y-5"><div class="grid-2 gap-4"><label>Completed Tasks *<textarea class="field" id="erDone">${er.tasksCompleted||''}</textarea></label><label>Pending Tasks<textarea class="field" id="erPending">${er.pendingTomorrow||''}</textarea></label><label>Reason for Delay<textarea class="field" id="erReason">${er.operationalChallenges||''}</textarea></label><label>Achievements<textarea class="field" id="erAch">${er.achievements||''}</textarea></label></div><h3 class="font-black">Today's Numbers</h3><div class="grid-4 gap-3">${['Registrations','Applications','Offers','CAS','COE','Visa updates','Calls','Meetings','Escalations resolved'].map((x,i)=>`<label>${x}<input type="number" min="0" class="field" id="erN${i}" value="${[12,18,7,4,2,5,8,3,2][i]}"></label>`).join('')}</div><div class="grid-2 gap-4"><label>Tomorrow Plan *<textarea class="field" id="erTomorrow">${er.tomorrowPlan||''}</textarea></label><label>Support Needed<textarea class="field" id="erSupport">${er.supportNeeded||''}</textarea></label></div><button class="btn primary w-full" onclick="submitEvening()">Submit report & check out</button></div>`;
}
async function submitEvening(){ const report={date:TODAY,tasksCompleted:$('erDone').value,pendingTomorrow:$('erPending').value,operationalChallenges:$('erReason').value,achievements:$('erAch').value,conversionUpdates:{registrationsCompleted:+$('erN0').value||0,applicationsSubmitted:+$('erN1').value||0,offersReceived:+$('erN2').value||0,cas:+$('erN3').value||0,coe:+$('erN4').value||0,visaUpdates:+$('erN5').value||0,calls:+$('erN6').value||0,meetings:+$('erN7').value||0,escalationsResolved:+$('erN8').value||0},tomorrowPlan:$('erTomorrow').value,supportNeeded:$('erSupport').value}; try{ const r=await fetch('/api/staff-portal/evening-report/'+API_EMP_ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)}); const j=await r.json(); if(!j.success) throw new Error(j.error); }catch(e){ set('tsEveningReport',report); } state.eveningReport=report; await checkOut(true); action('daily-report','Evening report submitted and checked out',report); switchTab('today'); }

function setButtonLoading(btn,label='Saving…'){ if(!btn)return; btn.disabled=true; btn.dataset.originalText=btn.innerHTML; btn.innerHTML=`<i class="fas fa-spinner fa-spin mr-2" aria-hidden="true"></i>${label}`; }
function resetButton(btn){ if(btn?.dataset.originalText){ btn.innerHTML=btn.dataset.originalText; btn.disabled=false; } }
function addTaskModal(){ openModal('Add Task','<div class="space-y-3"><label>Task title<input id="newTaskTitle" class="field" placeholder="Task title" required></label><div id="newTaskError" class="error-text">Task title is required.</div><select id="newTaskPriority" class="field" aria-label="Task priority"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="newTaskDue" class="field" placeholder="Due time/date" value="Today" aria-label="Task due date"><button id="saveTaskBtn" class="btn primary w-full" onclick="saveTask()">Save Task</button></div>','Create a role task for today'); }
function saveTask(){ const title=$('newTaskTitle').value.trim(); if(!title){ $('newTaskError').style.display='block'; $('newTaskTitle').focus(); return toast('Task title is required','err'); } setButtonLoading($('saveTaskBtn')); state.tasks.push({id:'t'+Date.now(),title,cat:'Admissions',priority:$('newTaskPriority').value,due:$('newTaskDue').value,status:'Pending',assignee:'TS',evidence:'Awaiting completion evidence'}); set('tsTasks',state.tasks); setTimeout(()=>{ closeModal(); action('task','Task created: '+title); switchTab('work'); },180); }
function editTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; openModal('Edit Task',`<div class="space-y-3"><label>Task title<input id="editTaskTitle" class="field" value="${esc(t.title)}"></label><div class="grid-3 gap-3"><label>Priority<select id="editTaskPriority" class="field"><option ${t.priority==='High'?'selected':''}>High</option><option ${t.priority==='Medium'?'selected':''}>Medium</option><option ${t.priority==='Low'?'selected':''}>Low</option></select></label><label>Status<select id="editTaskStatus" class="field"><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Pending'?'selected':''}>Pending</option><option ${t.status==='Upcoming'?'selected':''}>Upcoming</option><option ${t.status==='Completed'?'selected':''}>Completed</option></select></label><label>Due<input id="editTaskDue" class="field" value="${esc(t.due||'Today')}"></label></div><label>Category<input id="editTaskCat" class="field" value="${esc(t.cat||'General')}"></label><button class="btn primary w-full" onclick="saveEditedTask('${id}')">Save Changes</button></div>`,'Update task details without leaving the page'); }
function saveEditedTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; const title=$('editTaskTitle').value.trim(); if(!title)return toast('Task title is required','err'); Object.assign(t,{title,priority:$('editTaskPriority').value,status:$('editTaskStatus').value,due:$('editTaskDue').value,cat:$('editTaskCat').value}); set('tsTasks',state.tasks); closeModal(); action('task','Task updated: '+title,t); switchTab('work'); }
function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t)return; t.status=t.status==='Completed'?'Pending':'Completed'; set('tsTasks',state.tasks); action('task','Task '+(t.status==='Completed'?'completed':'reopened')+': '+t.title); switchTab('work'); }
function setWorkView(view){ state.workView=view; set('tsWorkView',view); action('navigation','My Work view opened: '+view); switchTab('work'); }
function groupTasks(){ const next=state.taskGroup==='none'?'priority':state.taskGroup==='priority'?'status':'none'; state.taskGroup=next; set('tsTaskGroup',next); action('task',next==='none'?'Task grouping cleared':'Tasks grouped by '+next); switchTab('work'); }
function addTodo(){ openModal('Add Personal To-Do','<div class="space-y-3"><input id="todoTitle" class="field" placeholder="Private reminder"><textarea id="todoNote" class="field" placeholder="Optional note"></textarea><button class="btn primary w-full" onclick="saveTodo()">Add To-Do</button></div>','Personal to-dos stay separate from KPI tasks.'); }
function saveTodo(){ const t=$('todoTitle').value.trim(); if(!t)return toast('To-do text is required','err'); const note=$('todoNote').value.trim(); state.todos.push(note?`${t} — ${note}`:t); set('tsTodos',state.todos); closeModal(); action('todo','Personal to-do added: '+t,{note}); switchTab('work'); }
function removeTodo(i){ const t=state.todos.splice(i,1)[0]; set('tsTodos',state.todos); action('todo','Personal to-do completed: '+t); switchTab('work'); }
function checkIn(){ openModal('Check In',`<div class="space-y-4"><p class="muted">Choose today’s work mode. Device, time, IP and GPS permission status will be logged.</p><input id="checkLocation" class="field" placeholder="Location" value="Office - Colombo HQ" aria-label="Check-in location"><div id="gpsStatus" class="hint">GPS not requested yet. Select a mode to request browser location.</div><div class="grid-3 gap-3"><button class="btn green" onclick="saveCheckIn('Office',this)"><i class="fas fa-building mr-2" aria-hidden="true"></i>Office</button><button class="btn" onclick="saveCheckIn('Remote',this)"><i class="fas fa-house-laptop mr-2" aria-hidden="true"></i>Remote</button><button class="btn orange" onclick="saveCheckIn('Field',this)"><i class="fas fa-location-dot mr-2" aria-hidden="true"></i>Field</button></div></div>`,'Attendance will open the morning planner after check-in.'); }
function getGps(){ return new Promise(resolve=>{ if(!navigator.geolocation) return resolve({status:'not-supported'}); navigator.geolocation.getCurrentPosition(p=>resolve({status:'verified',coords:`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`}),()=>resolve({status:'denied'}),{enableHighAccuracy:true,timeout:4500,maximumAge:60000}); }); }
async function saveCheckIn(mode,btn){ setButtonLoading(btn,'Verifying…'); if($('gpsStatus')) $('gpsStatus').textContent='Requesting GPS permission…'; const gps=await getGps(); const loc=$('checkLocation')?.value || (mode==='Office'?'Office - Colombo HQ':mode); const a={checkedIn:true,time:nowTime(),date:TODAY,mode,location:loc,ip:'Browser/API captured',device:navigator.userAgent,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,gpsStatus:gps.status,coords:gps.coords||''}; state.attendance=a; set('tsAttendance',a); try{await fetch('/api/v16l/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:PORTAL_USERNAME,employeeId:DISPLAY_EMP_ID,type:'check-in',mode,location:a.location,device:a.device,timezone:a.timezone,gpsStatus:a.gpsStatus,coords:a.coords})})}catch(e){} closeModal(); action('attendance','Checked in: '+mode,a); switchTab('morning'); }
async function checkOut(fromReport=false){ if(!fromReport && !state.eveningReport){ toast('Please submit the daily report before check out','err'); return switchTab('evening'); } const a=state.attendance||{}; a.checkedIn=false; a.checkedOut=nowTime(); a.hours='8h 30m'; state.attendance=a; set('tsAttendance',a); try{await fetch('/api/v16l/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:PORTAL_USERNAME,employeeId:DISPLAY_EMP_ID,type:'check-out'})})}catch(e){} if(!fromReport) action('attendance','Checked out',a); }
function applyLeave(){ openModal('Apply Leave','<div class="space-y-3"><select id="leaveType" class="field"><option>Annual Leave</option><option>Medical Leave</option><option>Personal Leave</option><option>Emergency Leave</option><option>Remote Work</option></select><input id="leaveDates" class="field" placeholder="Dates e.g. 10 Aug - 12 Aug 2026"><textarea id="leaveReason" class="field" placeholder="Reason"></textarea><button class="btn primary w-full" onclick="saveLeave()">Submit Leave Request</button></div>','Request goes to manager/COO'); }
function saveLeave(){ action('leave','Leave requested: '+$('leaveType').value,{type:$('leaveType').value,dates:$('leaveDates').value,reason:$('leaveReason').value}); closeModal(); switchTab('leave'); }
function logCall(){ openModal('Log Call','<div class="space-y-3"><input id="callName" class="field" placeholder="Client / student name"><input id="callPhone" class="field" placeholder="Phone number"><input id="callPurpose" class="field" placeholder="Purpose"><select id="callOutcome" class="field"><option>Follow Up Done</option><option>Information Sent</option><option>Docs Received</option><option>In Progress</option></select><button class="btn primary w-full" onclick="saveCall()">Save Call</button></div>','Calls can launch using tel: links; recording needs a telephony provider integration.'); }
function saveCall(){ const c={name:$('callName').value,phone:$('callPhone').value,purpose:$('callPurpose').value,outcome:$('callOutcome').value,duration:'Logged',time:nowTime()}; state.calls.push(c); set('tsCalls',state.calls); action('call','Call logged: '+c.name,c); closeModal(); switchTab('followups'); }
function callNumber(n){ action('call','Call started: '+n,{phone:n}); window.location.href='tel:'+String(n).replace(/[^\d+]/g,''); }
function sendWhatsApp(){ openModal('Send WhatsApp','<div class="space-y-3"><input id="waNumber" class="field" placeholder="Phone number e.g. +94771234567"><textarea id="waMessage" class="field" placeholder="Optional message">Assalamu Alaikum, this is Thasbiha from Global Guidance HR. I am following up regarding your application.</textarea><button class="btn green w-full" onclick="openWhatsApp()"><i class="fab fa-whatsapp mr-2"></i>Open WhatsApp</button></div>','The browser will open WhatsApp with this message ready to send.'); }
function openWhatsApp(){ const n=$('waNumber').value.replace(/[^\d]/g,''); if(!n)return toast('Phone number is required','err'); const msg=$('waMessage').value || ''; window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank'); closeModal(); action('whatsapp','WhatsApp opened',{phone:n,message:msg}); }
function newMessage(){ openModal('New Message','<div class="space-y-3"><input id="newMsgTo" class="field" placeholder="To"><textarea id="newMsgBody" class="field" placeholder="Message"></textarea><button class="btn primary w-full" onclick="saveNewMessage()">Send Message</button></div>'); }
function saveNewMessage(){ state.messages.push([$('newMsgTo').value,$('newMsgBody').value,nowTime()]); set('tsMessages',state.messages); closeModal(); action('message','Message sent to '+$('newMsgTo').value); switchTab('communication'); }
function sendMessage(){ const m=$('msgInput').value.trim(); if(!m)return; state.messages.push(['New conversation',m,nowTime()]); set('tsMessages',state.messages); action('message','Message sent in conversation',{message:m}); switchTab('communication'); }
function openConversation(name){ toast('Conversation opened: '+name); }
function uploadDoc(){ const input=document.createElement('input'); input.type='file'; input.onchange=()=>{ const f=input.files[0]; if(f) action('document','Document uploaded: '+f.name,{name:f.name,size:f.size}); }; input.click(); }

function runAIAction(x){ const h=get('tsAIHistory',[]); h.unshift(x); set('tsAIHistory',h.slice(0,12)); closeModal(); action('ai','AI action confirmed: '+x); toast('AI prepared: '+x); switchTab('ai'); }
function askAI(){ const q=$('aiInput').value.trim(); if(!q)return toast('Ask AI field is required','err'); aiQuick(q); }
function clearAI(){ set('tsAIHistory',[]); action('ai','AI chat history cleared'); switchTab('ai'); }
function markRead(){ set('tsNotificationsRead',true); document.querySelectorAll('.dot').forEach(d=>d.remove()); closeTopPopover(); action('notifications','All notifications marked as read'); }

function openSearch(){ const all=[...state.tasks.map(t=>['Task',t.title,t.cat]),...documents.map(d=>['Document',d[0],d[1]]),...staff.map(s=>['Staff',s[0],s[1]]),...calendar.map(c=>['Calendar',c[1],c[0]])]; openModal('Search GG OS',`<div class="space-y-3"><input id="globalSearch" class="field" placeholder="Search students, tasks, documents, reports..." aria-label="Search query" oninput="renderSearchResults(this.value)"><div class="hint">Search covers tasks, staff, documents and today’s calendar. Filters are available per module.</div><div id="searchResults">${all.slice(0,6).map(r=>`<button class="row w-full text-left" onclick="action('search','Opened ${esc(r[0])}: ${esc(r[1])}')"><span class="pill blue">${r[0]}</span><div><div class="font-black">${esc(r[1])}</div><div class="text-xs muted">${esc(r[2])}</div></div></button>`).join('')}</div></div>`,'Type to filter results.'); window.searchIndex=all; setTimeout(()=>$('globalSearch')?.focus(),50); }
function renderSearchResults(q){ const items=(window.searchIndex||[]).filter(r=>!q||r.join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,8); $('searchResults').innerHTML=items.length?items.map(r=>`<button class="row w-full text-left" onclick="action('search','Opened ${esc(r[0])}: ${esc(r[1])}')"><span class="pill blue">${r[0]}</span><div><div class="font-black">${esc(r[1])}</div><div class="text-xs muted">${esc(r[2])}</div></div></button>`).join(''):'<div class="empty-state">No results found. Try a student, task, document or staff name.</div>'; }
function openCalendarEvent(title,time,sub){ openModal('Calendar Event',`<div class="space-y-3"><div class="font-black text-lg">${title}</div><div><i class="far fa-clock mr-2"></i>${time}</div><div><i class="fas fa-location-dot mr-2"></i>${sub}</div><div class="hint">Calendar sync status: local event. Connect Google Calendar for two-way sync and reminders.</div><button class="btn primary w-full" onclick="closeModal()">Done</button></div>`,'Event details and synchronization'); }
function openCalendarSync(){ openModal('Calendar Sync',`<div class="space-y-3"><div class="hint">Google Calendar sync is available from Settings → Integrations. Until connected, events are stored in the portal activity log.</div><button class="btn primary w-full" onclick="switchTab('settings');closeModal()">Open Settings</button></div>`,'Calendar synchronization'); }
function closeTopPopover(){ const p=$('topPopover'); if(p) p.classList.remove('open'); }
function openTopPopover(html){ const p=$('topPopover'); if(!p)return; p.innerHTML=html; p.classList.add('open'); }
function openNotificationsMenu(){
  const read=get('tsNotificationsRead',false);
  openTopPopover(`<div class="popover-head"><b>Notifications</b><button class="link" onclick="markRead()">Mark all read</button></div><div class="popover-body">${notifications.slice(0,5).map(n=>`<button class="row w-full text-left px-4" onclick="action('notifications','Opened notification: ${esc(n[0])}');closeTopPopover()" title="Open notification: ${esc(n[0])}"><div class="stat-icon !w-10 !h-10 bg-blue-50 text-blue-600 !text-base"><i class="fas ${n[4]}" aria-hidden="true"></i></div><div class="flex-1"><div class="font-black">${esc(n[0])}</div><div class="text-xs muted">${esc(n[1])}</div></div><span class="text-xs muted">${esc(n[3])}</span>${read?'':'<span class="pill blue">Unread</span>'}</button>`).join('')}</div><div class="pad border-t border-slate-100"><button class="btn w-full" onclick="switchTab('notifications')">Open notification centre</button></div>`);
}
function openMessagesMenu(){
  const msgs=state.messages;
  openTopPopover(`<div class="popover-head"><b>Messages</b><button class="link" onclick="newMessage();closeTopPopover()">New</button></div><div class="popover-body">${msgs.length?msgs.slice(0,5).map(m=>`<button class="row w-full text-left px-4" onclick="openConversation('${esc(m[0])}');closeTopPopover()" title="Open conversation with ${esc(m[0])}"><div class="avatar !w-10 !h-10">${esc((m[0]||'N')[0])}</div><div class="flex-1"><div class="font-black">${esc(m[0])}</div><div class="text-xs muted">${esc(m[1])}</div></div><span class="text-xs text-blue-600">${esc(m[2])}</span></button>`).join(''):'<div class="section-empty m-4">No live messages yet.</div>'}</div><div class="pad border-t border-slate-100"><button class="btn w-full" onclick="switchTab('communication')">Open messages</button></div>`);
}
function hydrateControls(){
  document.querySelectorAll('#content .tab-chip').forEach(btn=>{ if(!btn.getAttribute('onclick')) btn.onclick=()=>{ btn.parentElement?.querySelectorAll('.tab-chip').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); action('navigation',(btn.textContent||'Tab').trim()+' opened'); }; });
  document.querySelectorAll('#content button').forEach(btn=>{ const label=(btn.textContent||btn.title||btn.getAttribute('aria-label')||'Open action').trim(); if(!btn.getAttribute('aria-label')) btn.setAttribute('aria-label',label); if(!btn.title) btn.title=label; if(!label && !btn.getAttribute('aria-label')) btn.setAttribute('aria-label','Open action'); });
  document.querySelectorAll('#content .link').forEach(btn=>{ if(!btn.getAttribute('onclick')) btn.onclick=()=>action('navigation',(btn.textContent||'Link').trim()+' opened'); });
}
function openAccountMenu(){ closeTopPopover(); openModal('Account Menu',`<div class="space-y-4"><div class="flex items-center gap-3 rounded-2xl bg-blue-50 p-4"><div class="avatar">HR</div><div><div class="font-black">HR Manager Portal</div><div class="text-xs muted">Thasbiha Sulaiman · HR Manager · ${DISPLAY_EMP_ID}</div><div class="text-xs text-emerald-600 mt-1">Online · secure session</div></div></div><button class="btn w-full text-left" onclick="switchTab('profile');closeModal()">View Profile</button><button class="btn w-full text-left" onclick="switchTab('settings');closeModal()">Account Settings</button><button class="btn w-full text-left" onclick="action('account','Active sessions opened')">Active Sessions & Devices</button><button class="btn red w-full text-left" onclick="logoutPortal()">Logout</button></div>`,'Account, security and session options'); }
function logoutPortal(){ action('auth','Logout selected'); closeModal(); toast('Logout ready — connected authentication will handle session sign-out.'); }
function editProfile(){ openModal('Edit Profile','<div class="space-y-3"><div class="grid-2 gap-3"><label>Name<input id="profileName" class="field" value="Thasbiha Sulaiman"></label><label>Designation<input id="profileRole" class="field" value="HR Manager"></label><label>Email<input id="profileEmail" class="field" value="thasbiha@global-guidance.com"></label><label>Phone<input id="profilePhone" class="field" value="+94 71 345 6789"></label></div><label>About<textarea id="profileAbout" class="field">HR Manager responsible for staff attendance, leave, employee records, HR documents and daily workflow compliance for Global Guidance.</textarea></label><button class="btn primary w-full" onclick="saveProfileLite()">Save Profile</button></div>','Profile edits are recorded in the activity log.'); }
function saveProfileLite(){ const profile={name:$('profileName').value,designation:$('profileRole').value,email:$('profileEmail').value,phone:$('profilePhone').value,about:$('profileAbout').value}; set('tsProfile',profile); closeModal(); action('profile','Profile updated',profile); switchTab('profile'); }
function saveSettings(){ action('settings','Settings saved'); }
function exportPayload(type){ return {type,user:USER,date:TODAY,generatedAt:new Date().toISOString(),attendance:state.attendance,tasks:state.tasks,todos:state.todos,calls:state.calls,messages:state.messages,kpi:state.kpi,morningPlan:state.morningPlan,eveningReport:state.eveningReport}; }
function flattenRows(data){
  const rows=[['Section','Field','Value']];
  rows.push(['User','Name',data.user.fullName],['User','Employee ID',data.user.employeeId],['User','Role',data.user.role],['Attendance','Status',data.attendance?.checkedIn?'Checked In':'Not checked in'],['Attendance','Mode',data.attendance?.mode||''],['Attendance','Location',data.attendance?.location||'']);
  data.tasks.forEach((t,i)=>rows.push([`Task ${i+1}`,t.title,`${t.priority} · ${t.status} · ${t.due}`]));
  data.todos.forEach((t,i)=>rows.push([`To-Do ${i+1}`,'Private reminder',t]));
  data.calls.forEach((c,i)=>rows.push([`Call ${i+1}`,c.name||c[0],c.purpose||c[2]||'']));
  return rows;
}
function downloadBlob(filename,type,body){ const blob=new Blob([body],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href); }
function downloadExport(type,format){
  const data=exportPayload(type); const rows=flattenRows(data); const base=`hr-manager-${type}-${TODAY}`;
  if(format==='json') downloadBlob(`${base}.json`,'application/json',JSON.stringify(data,null,2));
  if(format==='csv') downloadBlob(`${base}.csv`,'text/csv;charset=utf-8',rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'));
  if(format==='excel') downloadBlob(`${base}.xls`,'application/vnd.ms-excel;charset=utf-8',`<table>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`);
  if(format==='pdf'){ const w=window.open('','_blank'); if(!w)return toast('Popup blocked. Please allow popups to save PDF.','err'); w.document.write(`<html><head><title>${base}</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#071338}h1{margin:0 0 8px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border:1px solid #d9e2ef;padding:8px;text-align:left}th{background:#eef4ff}</style></head><body><h1>Global Guidance — ${esc(type)} export</h1><p>Thasbiha Sulaiman · HR Manager · ${DISPLAY_EMP_ID} · ${TODAY}</p><table>${rows.map((r,i)=>`<tr>${r.map(c=>`${i===0?'<th>':'<td>'}${esc(c)}${i===0?'</th>':'</td>'}`).join('')}</tr>`).join('')}</table><script>window.onload=()=>window.print()<\/script></body></html>`); w.document.close(); }
  action('export',`Prepared ${format.toUpperCase()} export for ${type}`,{type,format}); closeModal();
}
function exportReport(type){ openModal('Export '+type,`<div class="grid-2 gap-3"><button class="btn text-left" onclick="downloadExport('${type}','pdf')"><i class="far fa-file-pdf text-red-500 mr-2"></i><b>PDF</b><div class="text-xs muted">Printable CEO/share format</div></button><button class="btn text-left" onclick="downloadExport('${type}','excel')"><i class="far fa-file-excel text-emerald-600 mr-2"></i><b>Excel</b><div class="text-xs muted">Spreadsheet-compatible .xls</div></button><button class="btn text-left" onclick="downloadExport('${type}','csv')"><i class="fas fa-file-csv text-blue-600 mr-2"></i><b>CSV</b><div class="text-xs muted">Clean rows for Google Sheets import</div></button><button class="btn text-left" onclick="downloadExport('${type}','json')"><i class="far fa-file-code text-purple-600 mr-2"></i><b>JSON</b><div class="text-xs muted">Full activity/data payload</div></button></div>`,'Choose the format you want to download.'); }

document.addEventListener('click', e=>{ if(!e.target.closest?.('.top-actions')) closeTopPopover(); });
switchTab('today');
</script>
