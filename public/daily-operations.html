<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Operations - Global Guidance HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <nav id="topNav" class="bg-primary-600 text-white p-4 shadow-lg" style="display: none;">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold"><i class="fas fa-tasks mr-2"></i>Daily Operations</h1>
                <div class="flex items-center gap-4">
                    <span id="userName" class="text-sm"></span>
                    <a href="/" class="bg-white text-primary-600 px-4 py-2 rounded hover:bg-gray-100 transition">
                        <i class="fas fa-home mr-2"></i>Dashboard
                    </a>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-6">
            <!-- Tabs -->
            <div class="bg-white rounded-lg shadow-sm mb-6">
                <div class="flex border-b">
                    <button onclick="showView('dashboard')" id="tab-dashboard" class="tab-btn flex-1 px-6 py-4 font-semibold">
                        <i class="fas fa-chart-line mr-2"></i>Dashboard
                    </button>
                    <button onclick="showView('report')" id="tab-report" class="tab-btn flex-1 px-6 py-4 font-semibold">
                        <i class="fas fa-clipboard-check mr-2"></i>Submit Report
                    </button>
                    <button onclick="showView('history')" id="tab-history" class="tab-btn flex-1 px-6 py-4 font-semibold">
                        <i class="fas fa-history mr-2"></i>History
                    </button>
                </div>
            </div>

            <!-- Views -->
            <div id="view-dashboard" class="view-content">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-500">
                        <p class="text-gray-500 text-sm mb-1">Today's Report</p>
                        <p id="today-status" class="text-2xl font-bold">Loading...</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500">
                        <p class="text-gray-500 text-sm mb-1">This Month</p>
                        <p id="month-count" class="text-2xl font-bold">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-purple-500">
                        <p class="text-gray-500 text-sm mb-1">Status</p>
                        <p class="text-2xl font-bold text-green-600">Good</p>
                    </div>
                </div>

                <div id="pending-alert" class="bg-orange-50 border-l-4 border-orange-500 p-4 rounded mb-6 hidden">
                    <p class="text-orange-800 font-semibold">
                        <i class="fas fa-exclamation-triangle mr-2"></i>Daily Report Pending
                    </p>
                    <p class="text-orange-700 text-sm mt-1">Please submit your daily report before 4:45 PM</p>
                    <button onclick="showView('report')" class="mt-3 bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">
                        Submit Report Now
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="font-bold text-gray-800 mb-4">Recent Reports</h3>
                    <div id="recent-reports"></div>
                </div>
            </div>

            <div id="view-report" class="view-content hidden">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Daily Report - <span id="report-date"></span></h2>
                    <form id="report-form" class="space-y-6">
                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Check-in Time</label>
                            <input type="time" id="checkInTime" required class="w-full border rounded px-4 py-2">
                        </div>
                        
                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Today's Objectives (Minimum 3)</label>
                            <input type="text" id="obj1" required placeholder="Objective 1" class="w-full border rounded px-4 py-2 mb-2">
                            <input type="text" id="obj2" required placeholder="Objective 2" class="w-full border rounded px-4 py-2 mb-2">
                            <input type="text" id="obj3" required placeholder="Objective 3" class="w-full border rounded px-4 py-2">
                        </div>

                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Key Achievements</label>
                            <textarea id="achievements" rows="3" class="w-full border rounded px-4 py-2" placeholder="What did you accomplish today?"></textarea>
                        </div>

                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Challenges Faced</label>
                            <textarea id="challenges" rows="3" class="w-full border rounded px-4 py-2" placeholder="Any obstacles or difficulties?"></textarea>
                        </div>

                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Tomorrow's Plan</label>
                            <textarea id="tomorrowPlan" rows="3" class="w-full border rounded px-4 py-2" placeholder="What are your plans for tomorrow?"></textarea>
                        </div>

                        <div>
                            <label class="block font-semibold text-gray-700 mb-2">Mood</label>
                            <select id="mood" class="w-full border rounded px-4 py-2">
                                <option value="excellent">😊 Excellent</option>
                                <option value="good" selected>🙂 Good</option>
                                <option value="okay">😐 Okay</option>
                                <option value="bad">😟 Bad</option>
                            </select>
                        </div>

                        <div class="flex gap-4">
                            <button type="submit" class="bg-primary-600 text-white px-6 py-3 rounded-lg hover:bg-primary-700 font-semibold">
                                Submit Report
                            </button>
                            <button type="button" onclick="showView('dashboard')" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 font-semibold">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="view-history" class="view-content hidden">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Report History</h2>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tailwind config
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        };

        // State
        let currentUser = null;
        let reports = [];

        // Initialize
        async function init() {
            // Show nav bar only if not in iframe
            if (window.self === window.top) {
                document.getElementById('topNav').style.display = 'block';
            }
            
            // Get current user from localStorage (set by main app)
            const userData = localStorage.getItem('gg_hr_session');
            if (userData) {
                currentUser = JSON.parse(userData);
                document.getElementById('userName').textContent = currentUser.name;
            } else {
                console.log('[Daily Operations] No session found');
                return;
            }

            // Set current time
            const now = new Date();
            document.getElementById('checkInTime').value = now.toTimeString().slice(0,5);
            document.getElementById('report-date').textContent = now.toLocaleDateString();

            // Load reports
            await loadReports();
            showView('dashboard');
        }

        async function loadReports() {
            try {
                const res = await fetch('/api/daily-reports');
                const allReports = await res.json();
                reports = allReports.filter(r => r.employeeId === currentUser.employeeId);
                updateDashboard();
            } catch (err) {
                console.error('Failed to load reports:', err);
            }
        }

        function updateDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const todayReport = reports.find(r => r.date === today);
            
            document.getElementById('today-status').textContent = todayReport ? '✓ Submitted' : 'Pending';
            document.getElementById('today-status').className = todayReport ? 'text-2xl font-bold text-green-600' : 'text-2xl font-bold text-orange-600';
            document.getElementById('month-count').textContent = reports.length;
            document.getElementById('pending-alert').classList.toggle('hidden', !!todayReport);

            // Recent reports
            const recentHTML = reports.length === 0 
                ? '<p class="text-gray-500 text-center py-8">No reports yet</p>'
                : reports.slice(0, 5).map(r => `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded mb-2">
                        <div>
                            <p class="font-semibold text-gray-800">${new Date(r.date).toLocaleDateString()}</p>
                            <p class="text-sm text-gray-500">Check-in: ${r.checkInTime || 'N/A'}</p>
                        </div>
                        <span class="px-3 py-1 rounded text-sm ${
                            r.status === 'approved' ? 'bg-green-100 text-green-700' :
                            r.status === 'rejected' ? 'bg-red-100 text-red-700' :
                            'bg-yellow-100 text-yellow-700'
                        }">
                            ${r.status || 'pending'}
                        </span>
                    </div>
                `).join('');
            document.getElementById('recent-reports').innerHTML = recentHTML;
        }

        function showView(viewName) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(t => {
                t.classList.remove('text-primary-600', 'border-b-2', 'border-primary-600', 'bg-primary-50');
                t.classList.add('text-gray-600');
            });

            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            document.getElementById(`tab-${viewName}`).classList.add('text-primary-600', 'border-b-2', 'border-primary-600', 'bg-primary-50');
            document.getElementById(`tab-${viewName}`).classList.remove('text-gray-600');

            if (viewName === 'history') {
                updateHistory();
            }
        }

        function updateHistory() {
            const historyHTML = reports.length === 0
                ? '<p class="text-gray-500 text-center py-8">No reports yet</p>'
                : reports.map(r => `
                    <div class="p-4 bg-gray-50 rounded mb-3">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="font-bold text-gray-800">${new Date(r.date).toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}</p>
                                <p class="text-sm text-gray-500">Check-in: ${r.checkInTime || 'N/A'}</p>
                            </div>
                            <span class="px-3 py-1 rounded text-sm ${
                                r.status === 'approved' ? 'bg-green-100 text-green-700' :
                                r.status === 'rejected' ? 'bg-red-100 text-red-700' :
                                'bg-yellow-100 text-yellow-700'
                            }">
                                ${r.status || 'pending'}
                            </span>
                        </div>
                        ${r.objectives && r.objectives.length > 0 ? `
                            <div class="mb-2">
                                <p class="text-sm font-semibold text-gray-700 mb-1">Objectives:</p>
                                <ul class="text-sm text-gray-600 list-disc list-inside">
                                    ${r.objectives.map(obj => obj ? `<li>${obj}</li>` : '').join('')}
                                </ul>
                            </div>
                        ` : ''}
                        ${r.achievements ? `
                            <div class="mb-2">
                                <p class="text-sm font-semibold text-gray-700">Achievements:</p>
                                <p class="text-sm text-gray-600">${r.achievements}</p>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            document.getElementById('history-list').innerHTML = historyHTML;
        }

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                employeeId: currentUser.employeeId,
                employeeName: currentUser.name,
                date: new Date().toISOString().split('T')[0],
                checkInTime: document.getElementById('checkInTime').value,
                objectives: [
                    document.getElementById('obj1').value,
                    document.getElementById('obj2').value,
                    document.getElementById('obj3').value
                ],
                achievements: document.getElementById('achievements').value,
                challenges: document.getElementById('challenges').value,
                tomorrowPlan: document.getElementById('tomorrowPlan').value,
                mood: document.getElementById('mood').value
            };

            try {
                const res = await fetch('/api/daily-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (res.ok) {
                    alert('✅ Daily report submitted successfully!');
                    document.getElementById('report-form').reset();
                    document.getElementById('checkInTime').value = new Date().toTimeString().slice(0,5);
                    await loadReports();
                    showView('dashboard');
                } else {
                    alert('❌ Failed to submit report. Please try again.');
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('❌ Network error. Please try again.');
            }
        });

        // Initialize on load
        init();
    </script>
<script src="/static/rbac.js"></script>
<script src="/static/document-upload.js"></script>
</body>
</html>
