<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Management - Global Guidance HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-btn { border-bottom: 3px solid transparent; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .status-new { background: #dbeafe; color: #1e40af; }
        .status-contacted { background: #fef3c7; color: #92400e; }
        .status-qualified { background: #d1fae5; color: #065f46; }
        .status-registered { background: #e0e7ff; color: #3730a3; }
        .status-dropped { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <nav id="topNav" class="bg-blue-600 text-white p-4 shadow-lg" style="display: none;">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold"><i class="fas fa-user-plus mr-2"></i>Lead Management</h1>
                <div class="flex items-center gap-4">
                    <span id="userName" class="text-sm"></span>
                    <a href="/" class="bg-white text-blue-600 px-4 py-2 rounded hover:bg-gray-100 transition">
                        <i class="fas fa-home mr-2"></i>Dashboard
                    </a>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-6">
            <!-- Dashboard Stats -->
            <div id="stats" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6"></div>

            <!-- Controls -->
            <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                <div class="flex flex-wrap items-center gap-4">
                    <button onclick="showAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                        <i class="fas fa-plus mr-2"></i>Add Lead
                    </button>
                    <input type="text" id="searchInput" placeholder="Search leads..." 
                        class="border border-gray-300 rounded px-4 py-2 flex-1 min-w-[200px]"
                        oninput="handleSearch()">
                    <select id="statusFilter" class="border border-gray-300 rounded px-4 py-2" onchange="fetchLeads()">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="qualified">Qualified</option>
                        <option value="registered">Registered</option>
                        <option value="dropped">Dropped</option>
                    </select>
                    <select id="sourceFilter" class="border border-gray-300 rounded px-4 py-2" onchange="fetchLeads()">
                        <option value="">All Sources</option>
                        <option value="Google">Google</option>
                        <option value="Meta">Meta</option>
                        <option value="Walk-in">Walk-in</option>
                        <option value="Referral">Referral</option>
                    </select>
                </div>
            </div>

            <!-- Leads Table -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Country</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Source</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Counselor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTable" class="divide-y divide-gray-200"></tbody>
                </table>
                <div id="loadingMessage" class="p-8 text-center text-gray-500">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading leads...
                </div>
                <div id="emptyMessage" class="p-8 text-center text-gray-500 hidden">
                    No leads found. Click "Add Lead" to get started!
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="leadModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="modalTitle" class="text-2xl font-bold">Add New Lead</h2>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <form id="leadForm" onsubmit="handleSubmit(event)">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                            <input type="text" id="name" required class="w-full border border-gray-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                            <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                            <input type="tel" id="phone" required class="w-full border border-gray-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Destination Country *</label>
                            <select id="country" required class="w-full border border-gray-300 rounded px-3 py-2">
                                <option value="">Select Country</option>
                                <option value="UK">United Kingdom</option>
                                <option value="USA">United States</option>
                                <option value="Canada">Canada</option>
                                <option value="Australia">Australia</option>
                                <option value="Germany">Germany</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Intake Period</label>
                            <input type="text" id="intakePeriod" placeholder="e.g., September 2025" class="w-full border border-gray-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                            <select id="status" class="w-full border border-gray-300 rounded px-3 py-2">
                                <option value="new">New</option>
                                <option value="contacted">Contacted</option>
                                <option value="qualified">Qualified</option>
                                <option value="registered">Registered</option>
                                <option value="dropped">Dropped</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Lead Source</label>
                            <select id="source" class="w-full border border-gray-300 rounded px-3 py-2">
                                <option value="Google">Google</option>
                                <option value="Meta">Meta (Facebook/Instagram)</option>
                                <option value="Walk-in">Walk-in</option>
                                <option value="Referral">Referral</option>
                                <option value="Website">Website</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Follow-up Date</label>
                            <input type="date" id="followUpDate" class="w-full border border-gray-300 rounded px-3 py-2">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                            <textarea id="notes" rows="3" class="w-full border border-gray-300 rounded px-3 py-2"></textarea>
                        </div>
                    </div>
                    <div class="flex gap-4 mt-6">
                        <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                            <i class="fas fa-save mr-2"></i>Save Lead
                        </button>
                        <button type="button" onclick="closeModal()" class="flex-1 bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let leads = [];
        let currentEditId = null;

        // Initialize
        (function() {
            // Show nav bar only if not in iframe
            if (window.self === window.top) {
                document.getElementById('topNav').style.display = 'block';
            }
            
            const userData = localStorage.getItem('gg_hr_session');
            if (userData) {
                currentUser = JSON.parse(userData);
                document.getElementById('userName').textContent = currentUser.name;
                fetchStats();
                fetchLeads();
            } else {
                console.log('[Lead Management] No session found');
            }
        })();

        async function fetchStats() {
            try {
                const response = await fetch('/api/leads/stats');
                const stats = await response.json();
                
                document.getElementById('stats').innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Total Leads</p>
                                <p class="text-3xl font-bold text-blue-600">${stats.total}</p>
                            </div>
                            <i class="fas fa-users text-4xl text-blue-200"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Qualified</p>
                                <p class="text-3xl font-bold text-green-600">${stats.qualified}</p>
                            </div>
                            <i class="fas fa-check-circle text-4xl text-green-200"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">This Month</p>
                                <p class="text-3xl font-bold text-purple-600">${stats.thisMonth}</p>
                                <p class="text-xs text-gray-500">+${stats.growthRate}% growth</p>
                            </div>
                            <i class="fas fa-chart-line text-4xl text-purple-200"></i>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Flagged</p>
                                <p class="text-3xl font-bold text-red-600">${stats.flagged}</p>
                            </div>
                            <i class="fas fa-flag text-4xl text-red-200"></i>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        async function fetchLeads() {
            const statusFilter = document.getElementById('statusFilter').value;
            const sourceFilter = document.getElementById('sourceFilter').value;
            const searchTerm = document.getElementById('searchInput').value;
            
            let url = '/api/leads?';
            if (statusFilter) url += `status=${statusFilter}&`;
            if (sourceFilter) url += `source=${sourceFilter}&`;
            if (searchTerm) url += `search=${encodeURIComponent(searchTerm)}`;
            
            try {
                const response = await fetch(url);
                leads = await response.json();
                renderLeads();
            } catch (error) {
                console.error('Error fetching leads:', error);
                document.getElementById('loadingMessage').innerHTML = 
                    '<p class="text-red-600"><i class="fas fa-exclamation-circle mr-2"></i>Error loading leads</p>';
            }
        }

        function renderLeads() {
            const tbody = document.getElementById('leadsTable');
            const loading = document.getElementById('loadingMessage');
            const empty = document.getElementById('emptyMessage');
            
            loading.classList.add('hidden');
            
            if (leads.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            
            tbody.innerHTML = leads.map(lead => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            ${lead.flagged ? '<i class="fas fa-flag text-red-500 mr-2" title="' + lead.flagReason + '"></i>' : ''}
                            <span class="font-medium text-gray-900">${lead.name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.email}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.country}</td>
                    <td class="px-6 py-4">
                        <span class="status-badge status-${lead.status}">${lead.status.toUpperCase()}</span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.source}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${lead.assignedCounselor || '-'}</td>
                    <td class="px-6 py-4 text-sm">
                        <div class="flex gap-2">
                            <button onclick="editLead(${lead.id})" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteLead(${lead.id})" class="text-red-600 hover:text-red-800">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        let searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchLeads, 500);
        }

        function showAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Add New Lead';
            document.getElementById('leadForm').reset();
            document.getElementById('leadModal').classList.remove('hidden');
        }

        function editLead(id) {
            const lead = leads.find(l => l.id === id);
            if (!lead) return;
            
            currentEditId = id;
            document.getElementById('modalTitle').textContent = 'Edit Lead';
            document.getElementById('name').value = lead.name;
            document.getElementById('email').value = lead.email;
            document.getElementById('phone').value = lead.phone;
            document.getElementById('country').value = lead.country;
            document.getElementById('intakePeriod').value = lead.intakePeriod || '';
            document.getElementById('status').value = lead.status;
            document.getElementById('source').value = lead.source;
            document.getElementById('followUpDate').value = lead.followUpDate ? lead.followUpDate.split('T')[0] : '';
            document.getElementById('notes').value = lead.notes || '';
            
            document.getElementById('leadModal').classList.remove('hidden');
        }

        async function handleSubmit(event) {
            event.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value,
                intakePeriod: document.getElementById('intakePeriod').value,
                status: document.getElementById('status').value,
                source: document.getElementById('source').value,
                followUpDate: document.getElementById('followUpDate').value || null,
                notes: document.getElementById('notes').value,
                assignedCounselorId: currentUser.employeeId === 'GG001' ? 1 : 2,
                assignedCounselor: currentUser.name
            };
            
            try {
                const url = currentEditId ? `/api/leads/${currentEditId}` : '/api/leads';
                const method = currentEditId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    closeModal();
                    fetchStats();
                    fetchLeads();
                    alert(currentEditId ? 'Lead updated successfully!' : 'Lead added successfully!');
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving lead:', error);
                alert('Failed to save lead. Please try again.');
            }
        }

        async function deleteLead(id) {
            if (!confirm('Are you sure you want to delete this lead?')) return;
            
            try {
                const response = await fetch(`/api/leads/${id}`, { method: 'DELETE' });
                const result = await response.json();
                
                if (result.success) {
                    fetchStats();
                    fetchLeads();
                    alert('Lead deleted successfully!');
                } else {
                    alert('Error deleting lead: ' + result.error);
                }
            } catch (error) {
                console.error('Error deleting lead:', error);
                alert('Failed to delete lead. Please try again.');
            }
        }

        function closeModal() {
            document.getElementById('leadModal').classList.add('hidden');
            document.getElementById('leadForm').reset();
            currentEditId = null;
        }

        // Auto-refresh every 30 seconds
        setInterval(() => {
            fetchStats();
            fetchLeads();
        }, 30000);
    </script>
<script src="/static/rbac.js"></script>
<script src="/static/document-upload.js"></script>
</body>
</html>
