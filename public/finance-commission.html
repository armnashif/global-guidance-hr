        .module-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

            currentModule = module;

            document.querySelectorAll('.module-tab').forEach(tab => {

                tab.classList.add('border-transparent');
            });
            document.getElementById(`tab-${module}`).classList.add('border-blue-600', 'text-blue-600');

            // Render module content
            const container = document.getElementById('moduleContainer');
            switch(module) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    setTimeout(initDashboardCharts, 100);
                    break;
                case 'payable':
                    container.innerHTML = renderCommissionPayable();
                    break;
                case 'receivable':
                    container.innerHTML = renderCommissionReceivable();
                    break;
                case 'banking':
                    container.innerHTML = renderDailyBanking();
                    setTimeout(initBankingCharts, 100);
                    break;
                case 'cashflow':
                    container.innerHTML = renderCashflow();
                    setTimeout(initCashflowCharts, 100);
                    break;
                case 'petty':
                    container.innerHTML = renderPettyCash();
                    break;

                    break;

                                            <td class="px-6 py-4 text-sm text-gray-900">${p.description}</td>
                                            <td class="px-6 py-4 text-sm font-medium text-gray-900">
                                                ${p.currency} ${p.amount.toLocaleString()}
                                            </td>
                                            <td class="px-6 py-4 text-sm text-gray-600">${p.paidBy}</td>
                                            <td class="px-6 py-4 text-sm text-gray-600">${p.mode}</td>
                                            <td class="px-6 py-4">
                                                <span class="px-2 py-1 text-xs font-semibold rounded ${
                                                    p.status === 'Approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'
                                                }">
                                                    ${p.status}
                                                </span>
                                            </td>
                                            <td class="px-6 py-4">
                                                ${p.receipt ? '<i class="fas fa-file-image text-blue-600 mr-2" title="Has receipt"></i>' : ''}
                                                <button class="text-green-600 hover:text-green-800">
                                                    <i class="fas fa-check"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Budget Module
        function renderBudget() {
            return `
                <div class="space-y-6">
                    <!-- Month Selector -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-gray-800">Budget Overview - February 2026</h3>
                            <select class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option>February 2026</option>
                                <option>January 2026</option>
                                <option>December 2025</option>
                            </select>
                        </div>
                    </div>

                    <!-- Budget Summary -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white rounded-lg shadow-sm p-6 border-l-4 border-blue-500">
                            <p class="text-sm text-gray-600">Total Budget</p>
                            <p class="text-2xl font-bold text-gray-800 mt-1">LKR ${FINANCE_DATA.budget.reduce((s, b) => s + b.budget, 0).toLocaleString()}</p>
                        </div>
                        <div class="bg-white rounded-lg shadow-sm p-6 border-l-4 border-orange-500">
                            <p class="text-sm text-gray-600">Total Actual</p>
                            <p class="text-2xl font-bold text-gray-800 mt-1">LKR ${FINANCE_DATA.budget.reduce((s, b) => s + b.actual, 0).toLocaleString()}</p>
                        </div>
                        <div class="bg-white rounded-lg shadow-sm p-6 border-l-4 border-green-500">
                            <p class="text-sm text-gray-600">Variance</p>
                            <p class="text-2xl font-bold text-gray-800 mt-1">LKR ${FINANCE_DATA.budget.reduce((s, b) => s + b.variance, 0).toLocaleString()}</p>
                        </div>
                    </div>

                    <!-- Budget Chart -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Budget vs Actual</h3>
                        <div class="chart-container">
                            <canvas id="budgetChart"></canvas>
                        </div>
                    </div>

                    <!-- Budget Table -->
                    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Department</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Budget</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actual</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Variance</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">%</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    ${FINANCE_DATA.budget.map(b => `
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${b.category}</td>
                                            <td class="px-6 py-4 text-sm text-gray-600">${b.department}</td>
                                            <td class="px-6 py-4 text-sm text-gray-900">LKR ${b.budget.toLocaleString()}</td>
                                            <td class="px-6 py-4 text-sm text-gray-900">LKR ${b.actual.toLocaleString()}</td>
                                            <td class="px-6 py-4 text-sm font-medium ${b.variance < 0 ? 'text-green-600' : 'text-red-600'}">
                                                ${b.variance > 0 ? '+' : ''}LKR ${b.variance.toLocaleString()}
                                            </td>
                                            <td class="px-6 py-4 text-sm ${Math.abs(b.variancePercent) > 10 ? 'text-red-600 font-bold' : 'text-gray-600'}">
                                                ${b.variancePercent > 0 ? '+' : ''}${b.variancePercent}%
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="px-2 py-1 text-xs font-semibold rounded ${
                                                    b.status === 'Green' ? 'bg-green-100 text-green-800' :
                                                    b.status === 'Amber' ? 'bg-yellow-100 text-yellow-800' :
                                                    'bg-red-100 text-red-800'
                                                }">
                                                    <i class="fas fa-circle mr-1"></i>${b.status}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function initBudgetCharts() {
            const ctx = document.getElementById('budgetChart');
            if (ctx) {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: FINANCE_DATA.budget.map(b => b.category),
                        datasets: [
                            {
                                label: 'Budget',
                                data: FINANCE_DATA.budget.map(b => b.budget),
                                backgroundColor: '#3b82f6'
                            },
                            {
                                label: 'Actual',
                                data: FINANCE_DATA.budget.map(b => b.actual),
                                backgroundColor: '#10b981'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        }

        // Utility Functions
        function refreshData() {
            const currentTime = new Date().toLocaleTimeString();
            document.getElementById('lastUpdate').textContent = `Last updated: ${currentTime}`;
            switchModule(currentModule);
        }
    </script>
    <script src="/shared-auth.js"></script>
<script src="/static/rbac.js"></script>
<script src="/static/document-upload.js"></script>
</body>
</html>
