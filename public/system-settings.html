<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings & Administration - Global Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body.in-iframe .top-nav { display: none; }
        .settings-card { transition: all 0.3s ease; }
        .settings-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .status-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-active { background-color: #10b981; }
        .status-inactive { background-color: #ef4444; }
        .status-warning { background-color: #f59e0b; }
        .progress-bar { height: 8px; background-color: #e5e7eb; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #3b82f6; transition: width 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Top Navigation -->
    <nav class="top-nav bg-white shadow-sm border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fas fa-cog text-blue-600 mr-2"></i>
                System Settings & Administration
            </h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-600" id="lastUpdate">Last updated: Just now</span>
                <button onclick="saveAllSettings()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Save All Changes
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- Module Navigation Tabs -->
        <div class="bg-white rounded-lg shadow-sm mb-6 overflow-hidden">
            <div class="flex flex-wrap border-b border-gray-200">
                <button onclick="switchModule('overview')" id="tab-overview" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-tachometer-alt mr-2"></i>Overview
                </button>
                <button onclick="switchModule('data')" id="tab-data" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-database mr-2"></i>Data Management
                </button>
                <button onclick="switchModule('reports')" id="tab-reports" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-file-export mr-2"></i>Reporting & Export
                </button>
                <button onclick="switchModule('company')" id="tab-company" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-building mr-2"></i>Company Settings
                </button>
                <button onclick="switchModule('system')" id="tab-system" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-server mr-2"></i>System Config
                </button>
                <button onclick="switchModule('security')" id="tab-security" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-shield-alt mr-2"></i>Security
                </button>
                <button onclick="switchModule('roles')" id="tab-roles" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab" style="background:linear-gradient(90deg,#ede9fe,#fff);">
                    <i class="fas fa-user-shield mr-2 text-purple-600"></i>Roles &amp; Permissions
                </button>
                <button onclick="switchModule('performance')" id="tab-performance" class="px-6 py-4 font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 border-b-2 border-transparent focus:outline-none module-tab">
                    <i class="fas fa-rocket mr-2"></i>Performance
                </button>
            </div>
        </div>

        <!-- Module Container -->
        <div id="moduleContainer"></div>
    </div>

    <script>
        // Check if in iframe
        const isInIframe = window.self !== window.top;
        if (isInIframe) document.body.classList.add('in-iframe');

        // System Settings Data
        const SYSTEM_SETTINGS = {
            company: {
                name: 'Global Guidance Education Consultancy',
                email: 'info@globalguidance.lk',
                phone: '+94 11 234 5678',
                address: 'Colombo, Sri Lanka',
                website: 'www.globalguidance.lk',
                logo: '/static/logo.png',
                timezone: 'Asia/Colombo',
                currency: 'LKR',
                language: 'English'
            },
            system: {
                version: '1.0.0',
                environment: 'Production',
                database: 'D1 (SQLite)',
                storage: 'Cloudflare R2',
                cdn: 'Cloudflare CDN',
                uptime: '99.9%',
                lastBackup: '2026-02-08 01:00 AM',
                nextBackup: '2026-02-09 01:00 AM'
            },
            security: {
                sslEnabled: true,
                encryptionEnabled: true,
                twoFactorAuth: false,
                sessionTimeout: 30,
                passwordPolicy: 'Strong',
                auditLogging: true,
                gdprCompliant: true,
                lastSecurityAudit: '2026-02-01'
            },
            performance: {
                caching: true,
                compression: true,
                minification: true,
                lazyLoading: true,
                cdnEnabled: true,
                avgPageLoad: '450ms',
                avgApiResponse: '85ms',
                cacheHitRate: '92%'
            },
            notifications: {
                emailEnabled: true,
                smsEnabled: false,
                pushEnabled: true,
                whatsappEnabled: false,
                slackEnabled: false
            },
            backups: [
                { id: 1, date: '2026-02-08 01:00 AM', size: '245 MB', status: 'Success', type: 'Automatic' },
                { id: 2, date: '2026-02-07 01:00 AM', size: '242 MB', status: 'Success', type: 'Automatic' },
                { id: 3, date: '2026-02-06 01:00 AM', size: '238 MB', status: 'Success', type: 'Automatic' },
                { id: 4, date: '2026-02-05 12:30 PM', size: '236 MB', status: 'Success', type: 'Manual' },
                { id: 5, date: '2026-02-05 01:00 AM', size: '235 MB', status: 'Success', type: 'Automatic' }
            ],
            exports: [
                { id: 1, name: 'Applications Report', format: 'Excel', date: '2026-02-08', size: '1.2 MB', status: 'Completed' },
                { id: 2, name: 'Finance Summary', format: 'PDF', date: '2026-02-07', size: '345 KB', status: 'Completed' },
                { id: 3, name: 'Student Data', format: 'CSV', date: '2026-02-06', size: '2.1 MB', status: 'Completed' },
                { id: 4, name: 'Commission Report', format: 'Excel', date: '2026-02-05', size: '890 KB', status: 'Completed' }
            ]
        };

        // Current module state
        let currentModule = 'overview';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            switchModule('overview');
        });

        // Switch Module Function
        function switchModule(module) {
            currentModule = module;
            
            // Update tab styling
            document.querySelectorAll('.module-tab').forEach(tab => {
                tab.classList.remove('border-blue-600', 'text-blue-600');
                tab.classList.add('border-transparent');
            });
            document.getElementById(`tab-${module}`).classList.add('border-blue-600', 'text-blue-600');
            document.getElementById(`tab-${module}`).classList.remove('border-transparent');

            // Render module content
            const container = document.getElementById('moduleContainer');
            switch(module) {
                case 'overview':
                    container.innerHTML = renderOverview();
                    break;
                case 'data':
                    container.innerHTML = renderDataManagement();
                    break;
                case 'reports':
                    container.innerHTML = renderReporting();
                    break;
                case 'company':
                    container.innerHTML = renderCompanySettings();
                    break;
                case 'system':
                    container.innerHTML = renderSystemConfig();
                    break;
                case 'security':
                    container.innerHTML = renderSecurity();
                    break;
                case 'roles':
                    container.innerHTML = renderRolesPermissions();
                    setTimeout(initRolesPanel, 50);
                    break;
                case 'performance':
                    container.innerHTML = renderPerformance();
                    break;
            }
        }

        // ===== Roles & Permissions Module =====
        function renderRolesPermissions() {
            return `
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800">
                                <i class="fas fa-user-shield text-purple-600 mr-2"></i>Roles &amp; Permissions
                            </h3>
                            <p class="text-sm text-gray-500 mt-1">
                                Manage who can view, edit, or administer each feature of the system.
                                Add custom roles (BDM, HR Manager, etc.) and assign them to staff.
                            </p>
                        </div>
                        <span id="rbacStatus" class="text-xs text-gray-500"></span>
                    </div>

                    <div class="flex flex-wrap gap-2 border-b border-gray-200 mb-4" id="rbacSubTabs">
                        <button class="rbac-subtab px-4 py-2 font-medium text-purple-700 border-b-2 border-purple-700" data-sub="roles">
                            <i class="fas fa-user-tag mr-1"></i> Roles &amp; Permissions
                        </button>
                        <button class="rbac-subtab px-4 py-2 font-medium text-gray-600 border-b-2 border-transparent hover:text-purple-700" data-sub="users">
                            <i class="fas fa-users mr-1"></i> Users
                        </button>
                        <button class="rbac-subtab px-4 py-2 font-medium text-gray-600 border-b-2 border-transparent hover:text-purple-700" data-sub="features">
                            <i class="fas fa-th-large mr-1"></i> Features
                        </button>
                        <button class="rbac-subtab px-4 py-2 font-medium text-gray-600 border-b-2 border-transparent hover:text-purple-700" data-sub="audit">
                            <i class="fas fa-history mr-1"></i> Audit Log
                        </button>
                    </div>
                    <div id="rbacPanel" class="min-h-[400px]">
                        <p class="text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>Loading…</p>
                    </div>
                </div>
            `;
        }

        // RBAC inline panel (uses the same /api/rbac/* endpoints)
        const PERM_LEVELS = ['none', 'view', 'edit', 'admin'];
        const FALLBACK_FEATURES = [
            { id: 'leads', label: 'Leads / Lead Management', group: 'Sales' },
            { id: 'admissions', label: 'Admissions / Applications', group: 'Operations' },
            { id: 'finance', label: 'Finance & Commission', group: 'Finance' },
            { id: 'students', label: 'Students', group: 'Operations' },
            { id: 'comms', label: 'Communication Suite', group: 'Operations' },
            { id: 'daily-ops', label: 'Daily Operations', group: 'Operations' },
            { id: 'reports', label: 'Reports & Analytics', group: 'Management' },
            { id: 'visa', label: 'Visa Processing', group: 'Operations' },
            { id: 'leave', label: 'Leave Management', group: 'HR' },
            { id: 'red-flags', label: 'Red Flags', group: 'Management' },
            { id: 'system-settings', label: 'System Settings', group: 'Admin' },
            { id: 'document-upload', label: 'Document Upload Widget', group: 'Operations' },
            { id: 'whatsapp', label: 'WhatsApp Hub', group: 'Operations' },
            { id: 'location-tracker', label: 'Staff Location Tracker', group: 'HR' },
            { id: 'employees', label: 'Employee Management', group: 'HR' }
        ];
        let RBAC_STATE = { roles: [], features: [], users: [] };

        async function loadRbacState() {
            try {
                const r = await fetch('/api/rbac/state');
                const j = await r.json();
                if (j.success) {
                    RBAC_STATE = { roles: j.roles || [], features: j.features || [], users: j.users || [] };
                    document.getElementById('rbacStatus').innerHTML = `<span class="text-green-600"><i class="fas fa-check-circle"></i> Connected — ${RBAC_STATE.roles.length} roles, ${RBAC_STATE.users.length} users</span>`;
                }
            } catch (e) {
                document.getElementById('rbacStatus').innerHTML = '<span class="text-red-600"><i class="fas fa-times-circle"></i> Connection error</span>';
            }
        }

        function initRolesPanel() {
            document.querySelectorAll('.rbac-subtab').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.rbac-subtab').forEach(x => {
                        x.classList.remove('text-purple-700', 'border-purple-700');
                        x.classList.add('text-gray-600', 'border-transparent');
                    });
                    b.classList.add('text-purple-700', 'border-purple-700');
                    b.classList.remove('text-gray-600', 'border-transparent');
                    renderRbacSub(b.dataset.sub);
                };
            });
            loadRbacState().then(() => renderRbacSub('roles'));
        }

        async function renderRbacSub(sub) {
            const panel = document.getElementById('rbacPanel');
            if (!panel) return;
            panel.innerHTML = '<p class="text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>Loading…</p>';
            await loadRbacState();
            if (sub === 'roles')    return rbacRenderRoles(panel);
            if (sub === 'users')    return rbacRenderUsers(panel);
            if (sub === 'features') return rbacRenderFeatures(panel);
            if (sub === 'audit')    return rbacRenderAudit(panel);
        }

        function permSelectHTML(roleId, featId, current) {
            const css = current || 'none';
            const colors = { none:'bg-red-50 text-red-700', view:'bg-blue-50 text-blue-700', edit:'bg-green-50 text-green-700', admin:'bg-yellow-50 text-yellow-700' };
            return `<select class="rbac-perm border border-gray-300 rounded px-2 py-1 text-xs ${colors[css]}" data-role="${roleId}" data-feat="${featId}">
                ${PERM_LEVELS.map(p => `<option value="${p}" ${p===css?'selected':''}>${p}</option>`).join('')}
            </select>`;
        }

        function rbacRenderRoles(panel) {
            const features = RBAC_STATE.features.length ? RBAC_STATE.features : FALLBACK_FEATURES;
            const groups = {};
            features.forEach(f => (groups[f.group||'Other'] = groups[f.group||'Other'] || []).push(f));

            let html = `
                <div class="flex flex-wrap gap-2 mb-4 items-center">
                    <input id="newRoleName" class="border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="New role name (e.g. BDM, HR Manager)" style="min-width:280px;"/>
                    <button id="addRoleBtn" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium">
                        <i class="fas fa-plus mr-1"></i> Add Role
                    </button>
                    <span class="text-xs text-gray-500 ml-auto">Permission levels: <strong class="text-red-600">none</strong> → <strong class="text-blue-600">view</strong> → <strong class="text-green-600">edit</strong> → <strong class="text-yellow-600">admin</strong></span>
                </div>
            `;

            for (const role of RBAC_STATE.roles) {
                html += `
                    <div class="border border-gray-200 rounded-lg p-4 mb-4 bg-gray-50">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <span class="text-base font-semibold text-gray-800"><i class="fas fa-user-tag text-purple-600 mr-2"></i>${role.name}</span>
                                <span class="ml-2 text-xs px-2 py-0.5 rounded-full ${role.builtin?'bg-blue-100 text-blue-700':'bg-gray-200 text-gray-700'}">${role.builtin?'Built-in':'Custom'}</span>
                                ${role.description?`<span class="text-xs text-gray-500 ml-2">${role.description}</span>`:''}
                            </div>
                            <div>
                                <button class="rbac-bulk text-xs px-3 py-1 bg-gray-600 text-white rounded mr-2" data-role="${role.id}">Bulk Set</button>
                                ${!role.builtin ? `<button class="rbac-del-role text-xs px-3 py-1 bg-red-600 text-white rounded" data-role="${role.id}"><i class="fas fa-trash"></i></button>`:''}
                            </div>
                        </div>
                        <table class="w-full text-sm">
                            <thead><tr class="bg-white"><th class="text-left p-2 w-32">Group</th><th class="text-left p-2">Feature</th><th class="text-left p-2 w-32">Permission</th></tr></thead>
                            <tbody>
                                ${Object.keys(groups).sort().map(g => groups[g].map((f,i) => `
                                    <tr class="border-t border-gray-200">
                                        <td class="p-2">${i===0?`<strong>${g}</strong>`:''}</td>
                                        <td class="p-2">${f.label} <code class="text-xs text-gray-400">(${f.id})</code></td>
                                        <td class="p-2">${permSelectHTML(role.id, f.id, (role.permissions||{})[f.id]||'none')}</td>
                                    </tr>
                                `).join('')).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
            panel.innerHTML = html;

            panel.querySelector('#addRoleBtn').onclick = async () => {
                const name = panel.querySelector('#newRoleName').value.trim();
                if (!name) return alert('Enter a role name');
                const res = await fetch('/api/rbac/roles', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, by:(window.parent?.currentUser||{}).name || 'Admin' }) });
                const j = await res.json();
                if (j.success) renderRbacSub('roles');
                else alert(j.error || 'Failed');
            };

            panel.querySelectorAll('.rbac-perm').forEach(sel => {
                sel.onchange = async () => {
                    const res = await fetch('/api/rbac/roles/' + sel.dataset.role + '/permission', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ feature: sel.dataset.feat, permission: sel.value, by:(window.parent?.currentUser||{}).name || 'Admin' })
                    });
                    const j = await res.json();
                    if (!j.success) alert(j.error||'Failed');
                    else {
                        const colors = { none:'bg-red-50 text-red-700', view:'bg-blue-50 text-blue-700', edit:'bg-green-50 text-green-700', admin:'bg-yellow-50 text-yellow-700' };
                        sel.className = 'rbac-perm border border-gray-300 rounded px-2 py-1 text-xs ' + colors[sel.value];
                    }
                };
            });

            panel.querySelectorAll('.rbac-bulk').forEach(b => {
                b.onclick = async () => {
                    const lvl = prompt('Set ALL features for this role to:\\n(none / view / edit / admin)', 'view');
                    if (!lvl || !PERM_LEVELS.includes(lvl)) return;
                    const res = await fetch('/api/rbac/roles/' + b.dataset.role + '/bulk', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ permission:lvl, by:(window.parent?.currentUser||{}).name || 'Admin' }) });
                    const j = await res.json();
                    if (j.success) renderRbacSub('roles');
                    else alert(j.error||'Failed');
                };
            });

            panel.querySelectorAll('.rbac-del-role').forEach(b => {
                b.onclick = async () => {
                    if (!confirm('Delete this role? Users assigned will lose access until reassigned.')) return;
                    const res = await fetch('/api/rbac/roles/' + b.dataset.role, { method:'DELETE' });
                    const j = await res.json();
                    if (j.success) renderRbacSub('roles');
                    else alert(j.error||'Failed');
                };
            });
        }

        function rbacRenderUsers(panel) {
            const roleOpts = RBAC_STATE.roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            panel.innerHTML = `
                <div class="mb-3 flex items-center gap-2">
                    <input id="userSearch" class="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1 max-w-md" placeholder="Search users by name, employee ID, role…"/>
                    <span class="text-xs text-gray-500">${RBAC_STATE.users.length} users</span>
                </div>
                <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="text-left p-2">Employee ID</th>
                            <th class="text-left p-2">Name</th>
                            <th class="text-left p-2">Job Title</th>
                            <th class="text-left p-2">Department</th>
                            <th class="text-left p-2">Assigned Role</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                        ${RBAC_STATE.users.map(u => `
                            <tr class="border-t border-gray-200">
                                <td class="p-2 font-mono text-xs">${u.employeeId||'-'}</td>
                                <td class="p-2 font-medium">${u.name}</td>
                                <td class="p-2 text-gray-600">${u.role||'-'}</td>
                                <td class="p-2 text-gray-600">${u.department||'-'}</td>
                                <td class="p-2">
                                    <select class="user-role border border-gray-300 rounded px-2 py-1 text-xs" data-uid="${u.id||u.employeeId}">
                                        <option value="">(no role assigned)</option>
                                        ${RBAC_STATE.roles.map(r => `<option value="${r.id}" ${u.roleId===r.id?'selected':''}>${r.name}</option>`).join('')}
                                    </select>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            panel.querySelector('#userSearch').oninput = e => {
                const q = e.target.value.toLowerCase();
                panel.querySelectorAll('#usersBody tr').forEach(tr => {
                    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            };
            panel.querySelectorAll('.user-role').forEach(sel => {
                sel.onchange = async () => {
                    const res = await fetch('/api/rbac/users/' + sel.dataset.uid + '/role', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ roleId: sel.value, by:(window.parent?.currentUser||{}).name || 'Admin' }) });
                    const j = await res.json();
                    if (!j.success) alert(j.error||'Failed');
                };
            });
        }

        function rbacRenderFeatures(panel) {
            const features = RBAC_STATE.features.length ? RBAC_STATE.features : FALLBACK_FEATURES;
            panel.innerHTML = `
                <div class="mb-4 flex flex-wrap gap-2 items-center">
                    <input id="featId" class="border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="feature-id (e.g. mock-interviews)" style="width:200px;"/>
                    <input id="featLabel" class="border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Display label" style="width:240px;"/>
                    <input id="featGroup" class="border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Group (e.g. Operations)" style="width:160px;"/>
                    <button id="addFeatBtn" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium">
                        <i class="fas fa-plus mr-1"></i> Add Feature
                    </button>
                </div>
                <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
                    <thead class="bg-gray-100">
                        <tr><th class="text-left p-2">ID</th><th class="text-left p-2">Label</th><th class="text-left p-2">Group</th><th class="p-2"></th></tr>
                    </thead>
                    <tbody>
                        ${features.map(f => `
                            <tr class="border-t border-gray-200">
                                <td class="p-2"><code class="text-xs">${f.id}</code></td>
                                <td class="p-2">${f.label}</td>
                                <td class="p-2">${f.group||'-'}</td>
                                <td class="p-2 text-right">
                                    ${f.builtin ? '<span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-700 rounded">built-in</span>' : `<button class="del-feat px-2 py-1 bg-red-600 text-white rounded text-xs" data-id="${f.id}"><i class="fas fa-trash"></i></button>`}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            panel.querySelector('#addFeatBtn').onclick = async () => {
                const id = panel.querySelector('#featId').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
                const label = panel.querySelector('#featLabel').value.trim();
                const group = panel.querySelector('#featGroup').value.trim() || 'Other';
                if (!id || !label) return alert('ID and label required');
                const res = await fetch('/api/rbac/features', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, label, group, by:(window.parent?.currentUser||{}).name || 'Admin' }) });
                const j = await res.json();
                if (j.success) renderRbacSub('features');
                else alert(j.error||'Failed');
            };
            panel.querySelectorAll('.del-feat').forEach(b => {
                b.onclick = async () => {
                    if (!confirm('Delete this feature?')) return;
                    const res = await fetch('/api/rbac/features/' + b.dataset.id, { method:'DELETE' });
                    const j = await res.json();
                    if (j.success) renderRbacSub('features');
                    else alert(j.error||'Failed');
                };
            });
        }

        function createBackup() {
            const confirmed = confirm('Create Manual Backup?\n\nThis will create a full backup of all system data.\nEstimated size: ~250 MB\nTime: ~2 minutes\n\nProceed?');
            if (confirmed) {
                // Show loading indicator
                const originalText = event.target.innerHTML;
                event.target.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Backup...';
                event.target.disabled = true;
                
                // Simulate backup creation
                setTimeout(() => {
                    // Create backup data
                    const backupData = {
                        timestamp: new Date().toISOString(),
                        settings: localStorage.getItem('gghr_fresh_documents') || '[]',
                        employees: localStorage.getItem('gghr_fresh_employees') || '[]',
                        attendance: localStorage.getItem('gghr_fresh_attendanceData') || '[]',
                        leaves: localStorage.getItem('gghr_fresh_leaveRequests') || '[]',
                        messages: localStorage.getItem('gghr_fresh_messages') || '[]',
                        emails: localStorage.getItem('gghr_fresh_emails') || '[]'
                    };
                    
                    // Convert to JSON and create download
                    const dataStr = JSON.stringify(backupData, null, 2);
                    const dataBlob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(dataBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `global-guidance-backup-${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    event.target.innerHTML = originalText;
                    event.target.disabled = false;
                    alert('✅ Backup Created Successfully!\n\nThe backup file has been downloaded to your computer.\n\nFilename: global-guidance-backup-' + new Date().toISOString().split('T')[0] + '.json');
                }, 1500);
            }
        }

        function exportReport(format) {
            // Get all data from localStorage
            const allData = {
                employees: JSON.parse(localStorage.getItem('gghr_fresh_employees') || '[]'),
                attendance: JSON.parse(localStorage.getItem('gghr_fresh_attendanceData') || '[]'),
                leaves: JSON.parse(localStorage.getItem('gghr_fresh_leaveRequests') || '[]'),
                dailyReports: JSON.parse(localStorage.getItem('gghr_fresh_dailyReports') || '[]'),
                messages: JSON.parse(localStorage.getItem('gghr_fresh_messages') || '[]'),
                emails: JSON.parse(localStorage.getItem('gghr_fresh_emails') || '[]'),
                documents: JSON.parse(localStorage.getItem('gghr_fresh_documents') || '[]')
            };
            
            const exportDate = new Date().toISOString().split('T')[0];
            
            if (format === 'csv') {
                // Export as CSV
                let csvContent = 'Data Type,Count,Last Updated\n';
                csvContent += `Employees,${allData.employees.length},${exportDate}\n`;
                csvContent += `Attendance Records,${allData.attendance.length},${exportDate}\n`;
                csvContent += `Leave Requests,${allData.leaves.length},${exportDate}\n`;
                csvContent += `Daily Reports,${allData.dailyReports.length},${exportDate}\n`;
                csvContent += `Messages,${allData.messages.length},${exportDate}\n`;
                csvContent += `Emails,${allData.emails.length},${exportDate}\n`;
                csvContent += `Documents,${allData.documents.length},${exportDate}\n`;
                
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `global-guidance-export-${exportDate}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert('✅ Data Exported Successfully!\n\nFormat: CSV\nFilename: global-guidance-export-' + exportDate + '.csv\n\nThe file has been downloaded.');
            } else if (format === 'json') {
                // Export as JSON
                const jsonStr = JSON.stringify(allData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `global-guidance-export-${exportDate}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert('✅ Data Exported Successfully!\n\nFormat: JSON\nFilename: global-guidance-export-' + exportDate + '.json\n\nThe file has been downloaded.');
            } else if (format === 'excel') {
                alert('Excel export requires additional libraries.\n\nPlease use CSV format for now, which can be opened in Excel.\n\nClick "Export to CSV" to proceed.');
            } else {
                alert(`Export to ${format.toUpperCase()}\n\nSelect reports to export:\n- Applications & Visa\n- Finance & Commission\n- All Data\n\nClick OK to proceed with export.`);
            }
        }
