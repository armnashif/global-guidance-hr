<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Razan Thawus — Marketing, Operations & Finance Coordinator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .tab-active { color:#be185d; border-bottom:3px solid #be185d; }
  .kpi-card { transition:.2s; }
  .kpi-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .channel-fb { background:#1877f2; color:#fff; }
  .channel-ig { background:linear-gradient(135deg,#f09433,#dc2743,#bc1888); color:#fff; }
  .channel-tt { background:#000; color:#fff; }
  .channel-wa { background:#25d366; color:#fff; }
</style>
</head>
<body class="bg-gray-50">

<header class="bg-gradient-to-r from-pink-600 to-rose-700 text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold"><i class="fas fa-bullhorn mr-2"></i>Razan Thawus — Marketing, Operations & Finance Coordinator</h1>
      <p class="text-sm opacity-90 mt-1" id="todayDate"></p>
    </div>
    <div class="flex gap-2">
      <button onclick="switchTab('dashboard')" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-sm"><i class="fas fa-tachometer-alt mr-1"></i>Dashboard</button>
      <button onclick="window.print()" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-sm"><i class="fas fa-print mr-1"></i>Print</button>
    </div>
  </div>
</header>

<nav class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 flex flex-wrap gap-1 overflow-x-auto">
    <button class="portal-tab tab-active px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="dashboard"><i class="fas fa-tachometer-alt mr-1"></i>Dashboard</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="morning"><i class="fas fa-sun mr-1"></i>Morning Plan</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="evening"><i class="fas fa-moon mr-1"></i>Evening Report</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="leads"><i class="fas fa-bullseye mr-1"></i>Lead Gen</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="social"><i class="fab fa-instagram mr-1"></i>Social Media</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="apps-visa"><i class="fas fa-passport mr-1"></i>Apps & Visa</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="partners"><i class="fas fa-handshake mr-1"></i>Uni / Partners</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="events"><i class="fas fa-calendar-day mr-1"></i>Events</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="finance"><i class="fas fa-coins mr-1"></i>Finance</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="trackers"><i class="fas fa-table mr-1"></i>Trackers</button>
    <button class="portal-tab px-4 py-3 font-medium text-gray-700 hover:text-pink-700" data-tab="kpi"><i class="fas fa-chart-line mr-1"></i>KPIs</button>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-6" id="content"></main>

<script>
const USER = { id: 6, employeeId: 'GG006', name: 'Razan Thawus', role: 'Marketing, Operations & Finance Coordinator' };
const TODAY = new Date().toISOString().slice(0,10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

let state = { morningPlan:null, eveningReport:null, kpi:{weekly:{},monthly:{}},
  leadCampaigns:[], socialPosts:[], events:[], partners:[],
  finance:{refunds:[],commissions:[],pettyCash:[],expenses:[]}, trackers:[] };

async function loadAll() {
  try {
    const [mp, er, k, lc, sp, ev, pt, fn] = await Promise.all([
      fetch('/api/staff-portal/morning-plan/GG006/' + TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/evening-report/GG006/' + TODAY).then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/kpi/GG006').then(r=>r.json()).catch(()=>({})),
      fetch('/api/staff-portal/lead-campaigns/GG006').then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/social-posts/GG006').then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/events/GG006').then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/partners/GG006').then(r=>r.json()).catch(()=>({items:[]})),
      fetch('/api/staff-portal/finance/GG006').then(r=>r.json()).catch(()=>({}))
    ]);
    state.morningPlan = mp.plan || null;
    state.eveningReport = er.report || null;
    state.kpi = k.kpi || {weekly:{},monthly:{}};
    state.leadCampaigns = lc.items || [];
    state.socialPosts = sp.items || [];
    state.events = ev.items || [];
    state.partners = pt.items || [];
    state.finance = fn.finance || {refunds:[],commissions:[],pettyCash:[],expenses:[]};
  } catch(e) {}
}

function switchTab(name) {
  document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('tab-active'));
  document.querySelector(`.portal-tab[data-tab="${name}"]`).classList.add('tab-active');
  renderTab(name);
}
document.querySelectorAll('.portal-tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));

async function renderTab(name) {
  const el = document.getElementById('content');
  el.innerHTML = '<p class="text-gray-500"><i class="fas fa-spinner fa-spin"></i> Loading…</p>';
  await loadAll();
  if (name==='dashboard')   return renderDashboard(el);
  if (name==='morning')     return renderMorning(el);
  if (name==='evening')     return renderEvening(el);
  if (name==='leads')       return renderLeads(el);
  if (name==='social')      return renderSocial(el);
  if (name==='apps-visa')   return renderAppsVisa(el);
  if (name==='partners')    return renderPartners(el);
  if (name==='events')      return renderEvents(el);
  if (name==='finance')     return renderFinance(el);
  if (name==='trackers')    return renderTrackers(el);
  if (name==='kpi')         return renderKPI(el);
}

// ===== DASHBOARD =====
function renderDashboard(el) {
  const k = state.kpi.weekly || {};
  const m = state.kpi.monthly || {};
  el.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="kpi-card bg-white rounded-xl p-4 shadow-sm border-l-4 border-pink-500">
        <p class="text-xs text-gray-500 uppercase">Today's Plan</p>
        <p class="text-2xl font-bold">${state.morningPlan ? '✓ Done' : '⏳ Pending'}</p>
        <p class="text-xs ${state.morningPlan?'text-green-600':'text-red-600'} mt-1">${state.morningPlan ? (state.morningPlan.priorityTasks||[]).length+' tasks' : 'Submit morning plan'}</p>
      </div>
      <div class="kpi-card bg-white rounded-xl p-4 shadow-sm border-l-4 border-rose-500">
        <p class="text-xs text-gray-500 uppercase">Leads This Week</p>
        <p class="text-2xl font-bold">${k.leadsGenerated||0}</p>
        <p class="text-xs text-gray-600 mt-1">${k.leadsContacted||0} contacted</p>
      </div>
      <div class="kpi-card bg-white rounded-xl p-4 shadow-sm border-l-4 border-purple-500">
        <p class="text-xs text-gray-500 uppercase">Social Posts (week)</p>
        <p class="text-2xl font-bold">${k.socialPosts||0}</p>
        <p class="text-xs text-gray-600 mt-1">${state.socialPosts.filter(p=>p.status==='scheduled').length} scheduled</p>
      </div>
      <div class="kpi-card bg-white rounded-xl p-4 shadow-sm border-l-4 border-green-500">
        <p class="text-xs text-gray-500 uppercase">Revenue Tracked</p>
        <p class="text-2xl font-bold">LKR ${(m.revenueTracked||0).toLocaleString()}</p>
        <p class="text-xs text-gray-600 mt-1">${(state.finance.commissions||[]).length} commissions</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
      <div class="bg-white rounded-xl shadow-sm p-5">
        <h3 class="font-semibold mb-3"><i class="fas fa-bullseye text-rose-500 mr-2"></i>Active Lead Campaigns</h3>
        ${state.leadCampaigns.slice(0,4).map(c=>`
          <div class="border-b border-gray-100 py-2 text-sm">
            <strong>${c.name}</strong>
            <span class="ml-2 text-xs px-2 py-0.5 rounded ${c.status==='live'?'bg-green-100 text-green-700':'bg-gray-100'}">${c.status}</span>
            <p class="text-xs text-gray-600">${c.platform||''} · ${c.leadsCount||0} leads · LKR ${(c.budget||0).toLocaleString()}</p>
          </div>
        `).join('') || '<p class="text-sm text-gray-500">No active campaigns</p>'}
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <h3 class="font-semibold mb-3"><i class="fas fa-calendar-day text-purple-500 mr-2"></i>Upcoming Events</h3>
        ${state.events.slice(0,4).map(ev=>`
          <div class="border-b border-gray-100 py-2 text-sm">
            <strong>${ev.name}</strong> <span class="text-xs text-gray-500">${ev.date||''}</span>
            <p class="text-xs text-gray-600">${ev.venue||''} · ${ev.type||''}</p>
          </div>
        `).join('') || '<p class="text-sm text-gray-500">None scheduled</p>'}
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">
        <h3 class="font-semibold mb-3"><i class="fas fa-coins text-yellow-500 mr-2"></i>Pending Financial Matters</h3>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span>Refunds pending</span><strong class="text-red-600">${(state.finance.refunds||[]).filter(r=>r.status==='pending').length}</strong></div>
          <div class="flex justify-between"><span>Commissions awaiting</span><strong class="text-orange-600">${(state.finance.commissions||[]).filter(c=>c.status==='awaiting').length}</strong></div>
          <div class="flex justify-between"><span>Petty cash entries (mo)</span><strong>${(state.finance.pettyCash||[]).length}</strong></div>
          <div class="flex justify-between"><span>Monthly expenses</span><strong>${(state.finance.expenses||[]).length}</strong></div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-5">
      <h3 class="font-semibold mb-3"><i class="fas fa-chart-line text-green-500 mr-2"></i>Weekly Performance</h3>
      <div class="grid grid-cols-2 md:grid-cols-6 gap-3 text-center">
        ${[
          ['Leads', k.leadsGenerated||0, 'rose'],
          ['Contacted', k.leadsContacted||0, 'blue'],
          ['Apps Handled', k.applicationsHandled||0, 'purple'],
          ['Social', k.socialPosts||0, 'pink'],
          ['Conversions', k.registrationConversions||0, 'green'],
          ['Refunds Cleared', k.refundsCleared||0, 'orange']
        ].map(([l,v,c])=>`<div><p class="text-2xl font-bold text-${c}-700">${v}</p><p class="text-xs text-gray-500">${l}</p></div>`).join('')}
      </div>
    </div>
  `;
}

// ===== MORNING PLAN =====
function renderMorning(el) {
  const mp = state.morningPlan || { priorityTasks:[], marketingTasks:'', leadTargets:'', pendingApps:'', financeFollowUps:'', socialSchedule:'' };
  el.innerHTML = `
    <div class="bg-gradient-to-r from-pink-100 to-rose-100 rounded-xl p-4 mb-4">
      <h2 class="text-xl font-bold"><i class="fas fa-sun text-rose-500 mr-2"></i>Morning Task Planner — ${TODAY}</h2>
      <p class="text-sm text-gray-700 mt-1">Submit during attendance marking. Visible to CEO/COO.</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-6 space-y-5">
      <div>
        <h3 class="font-semibold mb-3">Priority Tasks Today</h3>
        <div id="taskList"></div>
        <button onclick="addTask()" class="text-sm text-pink-600 hover:underline"><i class="fas fa-plus"></i> Add task</button>
      </div>
      <div><h3 class="font-semibold mb-2">A. Priority Marketing Tasks</h3>
        <textarea id="marketingTasks" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Campaigns, designs, posts due today…">${mp.marketingTasks||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">B. Lead Generation Targets</h3>
        <textarea id="leadTargets" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Lead targets, channels to focus on…">${mp.leadTargets||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">C. Pending Applications</h3>
        <textarea id="pendingApps" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Applications/visa cases needing follow-up…">${mp.pendingApps||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">D. Finance Follow-Ups</h3>
        <textarea id="financeFollowUps" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Refunds, commissions, Amana finance, petty cash…">${mp.financeFollowUps||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">E. Social Media Schedule</h3>
        <textarea id="socialSchedule" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Posts to publish, stories, coordination with Shiran…">${mp.socialSchedule||''}</textarea></div>
      <button onclick="submitMorning()" class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 text-white rounded-lg font-semibold hover:from-pink-700 hover:to-rose-700">
        <i class="fas fa-paper-plane mr-2"></i>Submit Morning Plan
      </button>
    </div>
  `;
  renderTasks(mp.priorityTasks || [{title:'',priority:'P2',notes:''}]);
}
let _tasks = [];
function renderTasks(list) {
  _tasks = list.length ? list : [{title:'',priority:'P2',notes:''}];
  document.getElementById('taskList').innerHTML = _tasks.map((t,i)=>`
    <div class="flex gap-2 mb-2 items-start">
      <select onchange="_tasks[${i}].priority=this.value" class="border border-gray-300 rounded px-2 py-2 text-xs w-20">
        ${['P1','P2','P3','P4'].map(p=>`<option value="${p}" ${p===t.priority?'selected':''}>${p}</option>`).join('')}
      </select>
      <input value="${(t.title||'').replace(/"/g,'&quot;')}" oninput="_tasks[${i}].title=this.value" class="border border-gray-300 rounded px-3 py-2 text-sm flex-1" placeholder="Task title"/>
      <input value="${(t.notes||'').replace(/"/g,'&quot;')}" oninput="_tasks[${i}].notes=this.value" class="border border-gray-300 rounded px-3 py-2 text-sm flex-1" placeholder="Notes"/>
      <button onclick="_tasks.splice(${i},1);renderTasks(_tasks)" class="text-red-500 px-2"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}
function addTask() { _tasks.push({title:'',priority:'P3',notes:''}); renderTasks(_tasks); }

async function submitMorning() {
  const plan = {
    date: TODAY,
    priorityTasks: _tasks.filter(t=>t.title.trim()),
    marketingTasks: document.getElementById('marketingTasks').value,
    leadTargets: document.getElementById('leadTargets').value,
    pendingApps: document.getElementById('pendingApps').value,
    financeFollowUps: document.getElementById('financeFollowUps').value,
    socialSchedule: document.getElementById('socialSchedule').value
  };
  const res = await fetch('/api/staff-portal/morning-plan/GG006', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(plan) });
  const j = await res.json();
  if (j.success) { alert('Morning plan submitted ✓'); switchTab('dashboard'); }
  else alert(j.error||'Failed');
}

// ===== EVENING REPORT =====
function renderEvening(el) {
  const er = state.eveningReport || { leadsContacted:0, applicationsUpdated:0, campaignsCompleted:'', refundsCommissions:'', pendingTasks:'', operationalIssues:'' };
  el.innerHTML = `
    <div class="bg-gradient-to-r from-rose-100 to-pink-100 rounded-xl p-4 mb-4">
      <h2 class="text-xl font-bold"><i class="fas fa-moon text-pink-600 mr-2"></i>Evening Daily Report — ${TODAY}</h2>
      <p class="text-sm text-gray-700 mt-1">Mandatory before logout. KPIs auto-update.</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-6 space-y-5">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div><label class="text-xs text-gray-600">Leads Contacted</label><input id="leadsContacted" type="number" min="0" class="w-full border border-gray-300 rounded p-2" value="${er.leadsContacted||0}"/></div>
        <div><label class="text-xs text-gray-600">Applications Updated</label><input id="applicationsUpdated" type="number" min="0" class="w-full border border-gray-300 rounded p-2" value="${er.applicationsUpdated||0}"/></div>
        <div><label class="text-xs text-gray-600">Social Posts Done</label><input id="postsDone" type="number" min="0" class="w-full border border-gray-300 rounded p-2" value="${er.postsDone||0}"/></div>
        <div><label class="text-xs text-gray-600">Conversions</label><input id="conversions" type="number" min="0" class="w-full border border-gray-300 rounded p-2" value="${er.conversions||0}"/></div>
      </div>
      <div><h3 class="font-semibold mb-2">Campaigns Completed</h3>
        <textarea id="campaignsCompleted" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Marketing campaigns delivered today">${er.campaignsCompleted||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">Refund / Commission Updates</h3>
        <textarea id="refundsCommissions" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Financial updates processed">${er.refundsCommissions||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">Pending Tasks for Tomorrow</h3>
        <textarea id="pendingTasks" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Carry-forward">${er.pendingTasks||''}</textarea></div>
      <div><h3 class="font-semibold mb-2">Operational Issues Faced</h3>
        <textarea id="operationalIssues" class="w-full border border-gray-300 rounded-lg p-3 text-sm" rows="2" placeholder="Delays, system slowness, management dependencies">${er.operationalIssues||''}</textarea></div>
      <button onclick="submitEvening()" class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 text-white rounded-lg font-semibold">
        <i class="fas fa-check-circle mr-2"></i>Submit Evening Report
      </button>
    </div>
  `;
}
async function submitEvening() {
  const report = {
    date: TODAY,
    leadsContacted: +document.getElementById('leadsContacted').value || 0,
    applicationsUpdated: +document.getElementById('applicationsUpdated').value || 0,
    postsDone: +document.getElementById('postsDone').value || 0,
    conversions: +document.getElementById('conversions').value || 0,
    campaignsCompleted: document.getElementById('campaignsCompleted').value,
    refundsCommissions: document.getElementById('refundsCommissions').value,
    pendingTasks: document.getElementById('pendingTasks').value,
    operationalIssues: document.getElementById('operationalIssues').value
  };
  const res = await fetch('/api/staff-portal/evening-report/GG006', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(report) });
  const j = await res.json();
  if (j.success) { alert('Evening report submitted ✓'); switchTab('dashboard'); }
  else alert(j.error||'Failed');
}

// ===== LEAD GEN =====
function renderLeads(el) {
  el.innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-6">
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold"><i class="fas fa-bullseye text-rose-600 mr-2"></i>Lead Generation Campaigns</h2>
        <button onclick="addCampaign()" class="px-4 py-2 bg-rose-600 text-white rounded text-sm"><i class="fas fa-plus mr-1"></i>New Campaign</button>
      </div>
      <table class="w-full text-sm border border-gray-200 rounded">
        <thead class="bg-gray-100"><tr><th class="p-2 text-left">Campaign</th><th class="p-2 text-left">Platform</th><th class="p-2 text-left">Budget</th><th class="p-2 text-left">Leads</th><th class="p-2 text-left">Conversions</th><th class="p-2 text-left">Status</th><th class="p-2"></th></tr></thead>
        <tbody>
          ${state.leadCampaigns.map(c=>`
            <tr class="border-t border-gray-200">
              <td class="p-2 font-medium">${c.name}</td>
              <td class="p-2"><span class="channel-${(c.platform||'').toLowerCase().slice(0,2)} px-2 py-0.5 rounded text-xs">${c.platform||'-'}</span></td>
              <td class="p-2">LKR ${(c.budget||0).toLocaleString()}</td>
              <td class="p-2 font-semibold">${c.leadsCount||0}</td>
              <td class="p-2">${c.conversions||0}</td>
              <td class="p-2"><span class="text-xs px-2 py-0.5 rounded ${c.status==='live'?'bg-green-100 text-green-700':'bg-gray-100'}">${c.status||'planned'}</span></td>
              <td class="p-2 text-right"><button onclick="delCampaign('${c.id}')" class="text-red-600 text-xs"><i class="fas fa-trash"></i></button></td>
            </tr>
          `).join('') || '<tr><td colspan="7" class="p-4 text-center text-gray-500">No campaigns logged</td></tr>'}
        </tbody>
      </table>
      <p class="text-sm text-gray-600 mt-4">For full lead tracking, open the <a href="/lead-management" class="text-blue-600 underline">Lead Management module</a>.</p>
    </div>
  `;
}
async function addCampaign() {
  const name = prompt('Campaign name?'); if (!name) return;
  const platform = prompt('Platform? (Facebook / Instagram / TikTok / WhatsApp / Google)', 'Facebook');
  const budget = +prompt('Budget (LKR)?', '0') || 0;
  await fetch('/api/staff-portal/lead-campaigns/GG006', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name, platform, budget, status:'live', leadsCount:0, conversions:0 }) });
  switchTab('leads');
}
async function delCampaign(id) {
  if (!confirm('Delete?')) return;
  await fetch('/api/staff-portal/lead-campaigns/GG006/' + id, { method:'DELETE' });
  switchTab('leads');
}

// ===== SOCIAL =====
function renderSocial(el) {
  el.innerHTML = `
    <div class="bg-white rounded-xl shadow-sm p-6">
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold"><i class="fab fa-instagram text-pink-600 mr-2"></i>Social Media Calendar</h2>
        <button onclick="addPost()" class="px-4 py-2 bg-pink-600 text-white rounded text-sm"><i class="fas fa-plus mr-1"></i>Schedule Post</button>
      </div>

            <span>LKR ${(p.amount||0).toLocaleString()}</span>
          </div>
        `).join('') || '<p class="text-xs text-gray-500">No petty cash entries</p>'}
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5">

        </div>
        ${(f.expenses||[]).map(x=>`
          <div class="border-b border-gray-100 py-2 text-sm flex justify-between">
            <div><strong>${x.category}</strong><p class="text-xs text-gray-600">${x.description||''} · ${x.date||''}</p></div>
            <span>LKR ${(x.amount||0).toLocaleString()}</span>
          </div>
        `).join('') || '<p class="text-xs text-gray-500">No expenses logged</p>'}
      </div>
    </div>
  `;
}
async function addFinItem(kind) {
  let item = {};
  if (kind==='refunds') {
    item.studentName = prompt('Student name?'); if (!item.studentName) return;
    item.amount = +prompt('Amount (LKR)?','0')||0;
    item.reason = prompt('Reason?','');
    item.status = prompt('Status? (pending/paid)','pending');
  } else if (kind==='commissions') {
    item.university = prompt('University?'); if (!item.university) return;
    item.studentName = prompt('Student?','');
    item.amount = +prompt('Amount (LKR)?','0')||0;
    item.status = prompt('Status? (awaiting/received)','awaiting');
  } else if (kind==='pettyCash') {
    item.purpose = prompt('Purpose?'); if (!item.purpose) return;
    item.amount = +prompt('Amount (LKR)?','0')||0;
    item.date = TODAY;
  } else if (kind==='expenses') {
    item.category = prompt('Category? (Salary/Rent/Marketing/Utility/Other)','Other'); if (!item.category) return;
    item.description = prompt('Description?','');
    item.amount = +prompt('Amount (LKR)?','0')||0;
    item.date = TODAY;
  }
  await fetch('/api/staff-portal/finance/GG006/' + kind, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(item) });
  switchTab('finance');
}
